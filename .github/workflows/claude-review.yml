# Claude reviews every pull request (opened by Olympus or by hand) and posts its review on the PR.
# It never merges: Mo ships from Olympus. Uses Mo's Claude plan through the CLAUDE_CODE_OAUTH_TOKEN secret.
name: Claude code review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the code reviewer for Mo's company. Review this pull request.
            Read CLAUDE.md in the repo first and check the change against its rules.
            Flag only real problems: bugs, broken behaviour, rule violations from CLAUDE.md,
            security holes, and anything the PR description promises but does not do. Skip style opinions.
            Put line-specific problems as inline comments.

            Then post ONE summary comment on the PR with `gh pr comment`. Its first line must be exactly
            "Claude verdict: ship" if nothing real is wrong, or "Claude verdict: changes" if something must be fixed.
            After that, 2 or 3 plain sentences for Mo, no jargon. Never use em dashes or en dashes.
            Do not approve, merge, push or change anything.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
