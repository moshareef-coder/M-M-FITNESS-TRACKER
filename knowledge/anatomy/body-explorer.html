<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Body Explorer (Rive)</title>
<style>
  :root {
    --bg: #101418; --panel: #171c21; --panel-2: #1e242a; --border: #262d34;
    --text: #eaeef0; --muted: #8b9aa3; --accent: #7ec2ee; --gold: #d5a35f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, sans-serif; }
  header { max-width: 900px; margin: 0 auto; padding: 24px 20px 8px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13.5px; }
  main { max-width: 900px; margin: 0 auto; padding: 12px 20px 60px; display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
  .toggles { display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; flex-wrap: wrap; }
  .toggle-btn { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); border-radius: 100px; padding: 8px 16px; font-size: 13.5px; cursor: pointer; }
  .toggle-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
  .canvas-col { background: var(--panel); border: 1px solid var(--border); border-radius: 18px; padding: 16px; }
  #riveCanvas { width: 380px; height: 520px; display: block; border-radius: 10px; }
  .info-col { background: var(--panel); border: 1px solid var(--border); border-radius: 18px; padding: 20px; width: 320px; min-height: 520px; }
  .muscle-name { font-size: 19px; font-weight: 600; margin: 0 0 4px; }
  .muscle-group { color: var(--gold); font-size: 13px; text-transform: uppercase; letter-spacing: .03em; margin-bottom: 16px; }
  .sibling-title { color: var(--muted); font-size: 12.5px; margin: 18px 0 8px; }
  .sibling-row { padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .sibling-row.hi { color: var(--accent); font-weight: 600; }
  .empty-hint { color: var(--muted); font-size: 14px; }
  .demo-btn { margin-top: 20px; background: none; border: 1px solid var(--border); color: var(--text); border-radius: 100px; padding: 8px 14px; font-size: 12.5px; cursor: pointer; }
  .log { font-size: 11px; color: var(--muted); margin-top: 12px; white-space: pre-wrap; max-height: 100px; overflow-y: auto; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@rive-app/webgl2@2.42.0/rive.min.js"></script>
</head>
<body>
<header>
  <h1>Body Explorer</h1>
  <div class="sub">Tap any muscle to see what it is.</div>
</header>
<main>
  <div style="width:100%;">
    <div class="toggles">
      <button class="toggle-btn active" data-sex="Male">Male</button>
      <button class="toggle-btn" data-sex="Female">Female</button>
      <span style="width:1px;background:var(--border);"></span>
      <button class="toggle-btn active" data-view="Front">Front</button>
      <button class="toggle-btn" data-view="Back">Back</button>
    </div>
  </div>
  <div class="canvas-col"><canvas id="riveCanvas"></canvas></div>
  <div class="info-col" id="infoCol">
    <div class="empty-hint">Tap a muscle on the diagram.</div>
    <button class="demo-btn" id="demoBtn">Demo: highlight a few muscles</button>
    <div class="log" id="log"></div>
  </div>
</main>

<script type="module">
import { createBodyHeatmap, ALL_MUSCLES, RIVE_TO_APP_GROUP, APP_HEAT_PALETTE } from "./rive-body.mjs";

const log = (msg) => { const el = document.getElementById("log"); el.textContent += "\n" + msg; };

function labelize(muscleKey) {
  return muscleKey.replace(/([A-Z])/g, " $1").replace(/^./, (c) => c.toUpperCase());
}
function groupLabel(groupKey) {
  return { chest: "Chest", shoulders: "Shoulders", traps: "Traps", lats: "Back", lowerback: "Lower Back",
    biceps: "Biceps", triceps: "Triceps", forearms: "Forearms", abs: "Abs", obliques: "Obliques",
    glutes: "Glutes", quads: "Quads", hamstrings: "Hamstrings", calves: "Calves" }[groupKey] || groupKey;
}

let sex = "Male", view = "Front";
let controller = null;

function showMuscleInfo(muscleKey) {
  const group = RIVE_TO_APP_GROUP[muscleKey];
  const siblings = ALL_MUSCLES.filter((m) => RIVE_TO_APP_GROUP[m] === group);
  document.getElementById("infoCol").innerHTML = `
    <div class="muscle-name">${labelize(muscleKey)}</div>
    <div class="muscle-group">${groupLabel(group)}</div>
    ${siblings.length > 1 ? `
      <div class="sibling-title">Also in ${groupLabel(group)}</div>
      ${siblings.map((s) => `<div class="sibling-row ${s === muscleKey ? "hi" : ""}">${labelize(s)}</div>`).join("")}
    ` : ""}
    <button class="demo-btn" id="demoBtn">Demo: highlight a few muscles</button>
    <div class="log" id="log"></div>
  `;
  document.getElementById("demoBtn").onclick = runDemo;
}

function runDemo() {
  if (!controller) return;
  const demo = { rectusAbdominis: 4, pectoralisMajor: 2, biceps: 1, vastusLateralis: 3 };
  controller.setIntensities(demo);
  log("Set intensities: " + JSON.stringify(demo));
}

function load() {
  const canvas = document.getElementById("riveCanvas");
  const artboardName = `${sex}-${view}`;
  if (controller) controller.destroy();
  controller = createBodyHeatmap({
    canvas,
    artboardName,
    palette: APP_HEAT_PALETTE,
    intensities: {},
    onMuscleClick: (muscleKey) => showMuscleInfo(muscleKey),
    onLoad: () => log("Loaded " + artboardName),
  });
}

document.querySelectorAll("[data-sex]").forEach((btn) => {
  btn.onclick = () => {
    document.querySelectorAll("[data-sex]").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    sex = btn.dataset.sex;
    load();
  };
});
document.querySelectorAll("[data-view]").forEach((btn) => {
  btn.onclick = () => {
    document.querySelectorAll("[data-view]").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    view = btn.dataset.view;
    load();
  };
});
document.getElementById("demoBtn").onclick = runDemo;

load();
</script>
</body>
</html>
