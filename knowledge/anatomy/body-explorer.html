<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Body Explorer</title>
<style>
  :root {
    --bg: #0a0a0a; --panel: #14161a; --border: #262b33; --text: #eceef0; --muted: #8b93a1;
    --skin-cool: #d7dbe0; --skin-warm: #e8a58c; --skin-base: #2a2c30; --accent: #d5a35f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; }
  header { max-width: 900px; margin: 0 auto; padding: 24px 20px 8px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13.5px; }
  main { max-width: 900px; margin: 0 auto; padding: 12px 20px 60px; }

  .overview-row { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
  .body-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 18px; padding: 16px; width: 280px; }
  .body-panel svg { width: 100%; height: auto; display: block; }
  .body-panel .cap { text-align: center; color: var(--muted); font-size: 12px; margin-top: 6px; }
  .glow { filter: drop-shadow(0 0 3px rgba(255,255,255,0.45)) drop-shadow(0 0 7px rgba(255,255,255,0.2)); }
  .skin-cool { fill: var(--skin-cool); } .skin-warm { fill: var(--skin-warm); } .skin-base { fill: var(--skin-base); }
  .region { cursor: pointer; transition: opacity 0.15s; }
  .region:hover, .region.active { opacity: 0.7; }

  .detail-wrap { display: none; }
  .detail-wrap.open { display: block; }
  .overview-wrap.hidden-when-detail { display: block; }
  .overview-wrap.hidden-when-detail.hidden { display: none; }

  .detail-card { background: var(--panel); border: 1px solid var(--border); border-radius: 18px; padding: 20px; max-width: 640px; margin: 0 auto; }
  .back-btn { background: none; border: 1px solid var(--border); color: var(--text); border-radius: 100px; padding: 8px 16px; font-size: 13.5px; cursor: pointer; margin-bottom: 14px; }
  .detail-title { font-size: 19px; margin: 0 0 2px; }
  .detail-note { color: var(--muted); font-size: 12.5px; margin-bottom: 16px; }
  .detail-svg-wrap { display: flex; justify-content: center; margin-bottom: 16px; }
  .detail-svg-wrap svg { width: 260px; height: auto; }
  .muscle-seg { stroke: var(--bg); stroke-width: 1.5; cursor: pointer; transition: filter 0.15s; }
  .muscle-seg:hover, .muscle-seg.hi { filter: brightness(1.35); }
  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; }
  .legend-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; cursor: default; }
  .legend-swatch { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
  .legend-row.hi { color: var(--accent); }
  .fidelity-tag { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); border: 1px solid var(--border); border-radius: 100px; padding: 2px 8px; margin-left: 8px; vertical-align: middle; }
</style>
</head>
<body>
<header>
  <h1>Body Explorer — draft</h1>
  <div class="sub">Click any region on the body below to see every individual muscle inside it.</div>
</header>
<main>
  <div class="overview-wrap hidden-when-detail" id="overviewWrap">
    <div class="overview-row">
      <div class="body-panel">
        <svg id="frontSvg" viewBox="0 0 200 400" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="cap">Front</div>
      </div>
      <div class="body-panel">
        <svg id="backSvg" viewBox="0 0 200 400" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="cap">Back</div>
      </div>
    </div>
  </div>

  <div class="detail-wrap" id="detailWrap">
    <div class="detail-card">
      <button class="back-btn" id="backBtn">&larr; Back to body</button>
      <h2 class="detail-title" id="detailTitle"></h2>
      <div class="detail-note" id="detailNote"></div>
      <div class="detail-svg-wrap" id="detailSvgWrap"></div>
      <div class="legend" id="detailLegend"></div>
    </div>
  </div>
</main>

// Which muscle-data regions live inside each visually-distinct broad body-part shape.
// Some broad shapes (quads) combine several muscle-data entries -- see the note in the
// commit/README on why this grouping is anatomically the right call for a click target.
const BROAD_TO_DATA_KEYS = {
  traps: ["neckTraps"], shoulders: ["shoulders"], chest: ["chest"], lats: ["back"],
  lowerback: ["lowerBack"], biceps: ["biceps"], triceps: ["triceps"], forearms: ["forearms"],
  abs: ["abs"], obliques: ["obliques"], glutes: ["glutes"],
  quads: ["hipFlexors", "quads", "adductors"], hamstrings: ["hamstrings"], calves: ["calves"],
};

const PALETTE = ["#d5a35f","#7ec2ee","#4c9b72","#e2566c","#b98ce0","#5fc9c9","#e0a85f","#8ea3e8","#e07eb0","#9bc45f","#c9917e","#7ea8c4"];

document.querySelectorAll(".region").forEach((g) => {
  g.addEventListener("click", () => openDetail(g.dataset.broad));
});
document.getElementById("backBtn").addEventListener("click", closeDetail);

function musclesFor(broad) {
  const keys = BROAD_TO_DATA_KEYS[broad] || [];
  return keys.map((k) => ({ key: k, ...MUSCLE_REGIONS[k] }));
}

function openDetail(broad) {
  const clusters = musclesFor(broad);
  if (!clusters.length) return;
  const title = clusters.length === 1 ? clusters[0].label : clusters.map((c) => c.label).join(" / ");
  document.getElementById("detailTitle").textContent = title;

  // Flatten to one indexed list across clusters, each gets a stable color from PALETTE.
  const flat = [];
  clusters.forEach((c) => c.muscles.forEach((m) => flat.push({ ...m, cluster: c.label })));

  const renderer = DETAIL_RENDERERS[broad] || renderGenericDetail;
  const { svg, fidelity } = renderer(flat);
  document.getElementById("detailSvgWrap").innerHTML = svg;
  document.getElementById("detailNote").innerHTML = `${flat.length} muscles in this region.${fidelity === "sketch" ? ' <span class="fidelity-tag">early pass</span>' : ""}`;

  document.getElementById("detailLegend").innerHTML = flat.map((m, i) => `
    <div class="legend-row" data-i="${i}">
      <span class="legend-swatch" style="background:${PALETTE[i % PALETTE.length]}"></span>
      <span>${m.name}</span>
    </div>`).join("");

  wireHighlight(flat.length);

  document.getElementById("overviewWrap").classList.add("hidden");
  document.getElementById("detailWrap").classList.add("open");
  window.scrollTo(0, 0);
}

function closeDetail() {
  document.getElementById("detailWrap").classList.remove("open");
  document.getElementById("overviewWrap").classList.remove("hidden");
}

function wireHighlight(n) {
  for (let i = 0; i < n; i++) {
    const seg = document.querySelector(`.muscle-seg[data-i="${i}"]`);
    const row = document.querySelector(`.legend-row[data-i="${i}"]`);
    if (!seg || !row) continue;
    const on = () => { seg.classList.add("hi"); row.classList.add("hi"); };
    const off = () => { seg.classList.remove("hi"); row.classList.remove("hi"); };
    seg.addEventListener("mouseenter", on); seg.addEventListener("mouseleave", off);
    row.addEventListener("mouseenter", on); row.addEventListener("mouseleave", off);
  }
}

function seg(i, d, extra = "") {
  return `<path class="muscle-seg" data-i="${i}" d="${d}" fill="${PALETTE[i % PALETTE.length]}" ${extra} />`;
}
function svgWrap(viewBox, inner) {
  return { svg: `<svg viewBox="${viewBox}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>` };
}

// ---------------------------------------------------------------------------
// Hand-authored detail illustrations. Each takes the flattened muscle list (same order as the
// legend) and returns real, anatomically-reasoned sub-shapes -- not generic stripes.
// ---------------------------------------------------------------------------
const DETAIL_RENDERERS = {};

// Chest needs a real diagonal clav/sternal split plus pec minor + serratus fingers -- built
// directly (not via the generic seg() helper above, which was a first pass) for real accuracy.

);

    `<path class="muscle-seg" data-i="4" d="M78 90 C74 116 76 148 84 172 C88 182 96 182 98 174 C92 150 88 122 88 96 C86 90 82 88 78 90 Z" fill="${PALETTE[4]}" />`, // vastus medialis (inner, teardrop to knee)
    `<path class="muscle-seg" data-i="5" d="M96 66 C102 88 102 118 98 144 L88 142 C90 116 90 90 88 70 Z" fill="${PALETTE[5]}" />`, // vastus intermedius (deep, thin sliver visible between)

    `<path class="muscle-seg" data-i="10" d="M48 52 C42 62 40 74 42 86 C44 92 50 90 50 82 C48 72 48 62 52 54 Z" fill="${PALETTE[10]}" />`, // pectineus (top, near groin)

DETAIL_RENDERERS.glutes = (m) => svgWrap("0 0 220 220",
  seg(0, "M40 60 C30 80 30 120 46 148 C60 172 96 176 116 158 C122 130 118 90 100 66 C82 46 54 44 40 60 Z") + // gluteus maximus

// ---------------------------------------------------------------------------
// Generic fallback for regions not yet hand-illustrated: real anatomical ORDER (superficial to
// deep, proximal to distal, matching muscle-data.mjs), but laid out as clipped bands within the
// region's actual silhouette rather than a bespoke shape per muscle. Correctly labeled and
// correctly counted -- just less visually bespoke than the hand-drawn ones above.
// ---------------------------------------------------------------------------
function renderGenericDetail(m) {
  const w = 200, h = 240;
  const n = m.length;
  const bandW = w / n;
  const bodyPath = "M100 10 C60 10 40 40 40 90 C40 150 50 200 60 230 L140 230 C150 200 160 150 160 90 C160 40 140 10 100 10 Z";
  const clipId = "clip" + Math.random().toString(36).slice(2, 8);
  const bands = m.map((_, i) => seg(i, `M${(i * bandW).toFixed(1)} 0 h${bandW.toFixed(1)} v${h} h-${bandW.toFixed(1)} Z`, `clip-path="url(#${clipId})"`)).join("");
  return {
    fidelity: "sketch",
    svg: `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
      <defs><clipPath id="${clipId}"><path d="${bodyPath}" /></clipPath></defs>
      <path d="${bodyPath}" fill="#2a2c30" />
      <g>${bands}</g>
    </svg>`,
  };
}
