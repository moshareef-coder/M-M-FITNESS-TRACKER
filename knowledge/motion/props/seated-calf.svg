<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <!-- Plate loaded seated calf raise, side view, rider facing right. Drawn in
       the rig's own 140-unit space with the floor at y=118. The thigh pad and
       its arm are NOT here: they ride with the thighs as a lever prop from the
       pivot on the front column. The seat, foot block, column and plate horn
       stay still. #back sits behind the body; #front is empty on purpose. -->
  <defs>
    <linearGradient id="scSteel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b4149"/><stop offset=".5" stop-color="#4b525c"/><stop offset="1" stop-color="#343a41"/>
    </linearGradient>
    <linearGradient id="scPad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f35"/><stop offset="1" stop-color="#16191d"/>
    </linearGradient>
  </defs>

  <g id="back">
    <!-- base rail with rubber feet -->
    <rect x="30" y="113.5" width="80" height="4.5" rx="1.8" fill="url(#scSteel)"/>
    <rect x="27" y="115" width="13" height="3.5" rx="1.6" fill="#2a2f35"/>
    <rect x="100" y="115" width="13" height="3.5" rx="1.6" fill="#2a2f35"/>

    <!-- seat post and the low seat -->
    <rect x="43" y="92" width="7" height="22" rx="1.4" fill="url(#scSteel)"/>
    <rect x="40" y="93" width="13" height="2.4" rx="1" fill="#30363d"/>
    <rect x="33" y="89" width="30" height="6.5" rx="2.8" fill="url(#scPad)"/>
    <rect x="34.5" y="90.2" width="27" height="1.4" rx="0.7" fill="#3a4049" opacity=".55"/>
    <!-- grab handle at the seat front -->
    <rect x="59" y="94.6" width="12" height="2.2" rx="1.1" fill="#8b95a2"/>
    <rect x="60" y="95" width="10" height="0.7" rx="0.35" fill="#b4bcc6"/>

    <!-- front column: carries the foot block, the arm pivot and the plate horn -->
    <rect x="97" y="66" width="7" height="48" rx="1.4" fill="url(#scSteel)"/>
    <rect x="97.8" y="67" width="1.6" height="46" rx="0.8" fill="#5c646f" opacity=".6"/>

    <!-- foot block, toes on top, heels hang off the back edge -->
    <rect x="82" y="104" width="16.5" height="10.5" rx="1.6" fill="url(#scSteel)"/>
    <rect x="82" y="104" width="16.5" height="3.2" rx="1.3" fill="#16191d"/>
    <path d="M84.5 104.8 v1.8 M86.5 104.8 v1.8 M88.5 104.8 v1.8 M90.5 104.8 v1.8 M92.5 104.8 v1.8 M94.5 104.8 v1.8 M96.5 104.8 v1.8" stroke="#3a4049" stroke-width="0.8" stroke-linecap="round"/>

    <!-- plate horn and two plates seen face on -->
    <rect x="98" y="74" width="9" height="3.2" rx="1.4" fill="#5c646f"/>
    <circle cx="108" cy="76" r="9.5" fill="#262a30"/>
    <circle cx="108" cy="76" r="7.2" fill="#3a4048" opacity=".55"/>
    <circle cx="108" cy="76" r="9.5" fill="none" stroke="#16191d" stroke-width="0.8"/>
    <circle cx="108" cy="76" r="1.8" fill="#8b95a2"/>
  </g>

  <g id="front"></g>
</svg>
