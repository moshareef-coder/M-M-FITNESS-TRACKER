<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <!-- Landmine attachment, side view, in the rig's 140-unit space with the
       floor at y=118. A flat steel base plate on the floor, a short post up
       to the swivel at (26,112): the lever prop draws the bar and its pivot
       bolt on top of the post. Slide with dx for a move that pivots
       elsewhere. -->
  <defs>
    <linearGradient id="lmSteel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b4149"/><stop offset=".5" stop-color="#4b525c"/><stop offset="1" stop-color="#343a41"/>
    </linearGradient>
  </defs>
  <g id="back">
    <!-- base plate on the floor, with the two anchor bolts -->
    <rect x="17" y="115.4" width="18" height="2.8" rx="1" fill="url(#lmSteel)"/>
    <rect x="17" y="115.4" width="18" height="0.8" rx="0.4" fill="#5c646f"/>
    <circle cx="20" cy="116.8" r="0.7" fill="#262a30"/>
    <circle cx="32" cy="116.8" r="0.7" fill="#262a30"/>
    <!-- post up to the swivel, with the yoke ears either side of the pivot -->
    <rect x="23.8" y="110.5" width="4.4" height="5.4" rx="0.8" fill="url(#lmSteel)"/>
    <rect x="22.4" y="109.6" width="7.2" height="4.2" rx="1.6" fill="#30363d"/>
  </g>
  <g id="front"></g>
</svg>
