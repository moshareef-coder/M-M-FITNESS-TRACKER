<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <!-- The overhead beam of a cable crossover, front view, joining the two
       towers the cable props draw at x 10 and x 130. Their columns start at
       y 3, so the beam caps them. Drawn behind the figure. -->
  <defs>
    <linearGradient id="cbSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c646f"/><stop offset=".45" stop-color="#454c56"/><stop offset="1" stop-color="#30363d"/>
    </linearGradient>
  </defs>
  <g id="back">
    <rect x="4" y="1.2" width="132" height="5.4" rx="1.6" fill="url(#cbSteel)"/>
    <rect x="5.5" y="6.6" width="9" height="2" rx="0.8" fill="#30363d"/>
    <rect x="125.5" y="6.6" width="9" height="2" rx="0.8" fill="#30363d"/>
  </g>
  <g id="front">
  </g>
</svg>
