<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20">
  <!-- Ab wheel, side view, a held sprite: the wheel centred in the box so it
       pins to a hand point, radius 8.5 figure units (a large roller wheel).
       A wide rubber tread, a lighter sidewall, the handle axle through the
       hub seen end on. Everything is in #back so the hands draw over the
       near grip. -->
  <defs>
    <linearGradient id="awSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4048"/><stop offset="1" stop-color="#262a30"/>
    </linearGradient>
  </defs>
  <g id="back">
    <!-- tread -->
    <circle cx="10" cy="10" r="8.5" fill="#16191d"/>
    <circle cx="10" cy="10" r="8.2" fill="none" stroke="#31363d" stroke-width="0.6"/>
    <!-- sidewall -->
    <circle cx="10" cy="10" r="6.6" fill="url(#awSide)"/>
    <circle cx="10" cy="10" r="5.1" fill="none" stroke="#454c56" stroke-width="0.7"/>
    <!-- hub and the handle end, a foam grip seen end on -->
    <circle cx="10" cy="10" r="3" fill="#5d6672"/>
    <circle cx="10" cy="10" r="2.2" fill="#8b95a2"/>
    <circle cx="10" cy="10" r="1.6" fill="#20242a"/>
    <circle cx="10" cy="10" r="0.9" fill="#31363d"/>
  </g>
  <g id="front"></g>
</svg>
