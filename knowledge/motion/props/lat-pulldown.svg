<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <!-- Lat pulldown, side view, drawn to the rig's own 140-unit space with the
       floor at y=118, so it composites with the figure without any scaling.
       Two groups: #back sits behind the body, #front in front of it. -->
  <defs>
    <linearGradient id="lpSteel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b4149"/><stop offset=".5" stop-color="#4b525c"/><stop offset="1" stop-color="#343a41"/>
    </linearGradient>
    <linearGradient id="lpPad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f35"/><stop offset="1" stop-color="#16191d"/>
    </linearGradient>
  </defs>

  <g id="back">
    <!-- base rail and the curved foot at the bench end -->
    <path d="M30 118 h74 v-4 H38 a8 8 0 0 1 -8 -8 v-6 a4 4 0 0 0 -8 0 v14 a4 4 0 0 0 4 4 z" fill="url(#lpSteel)"/>
    <rect x="24" y="115" width="14" height="3.5" rx="1.6" fill="#2a2f35"/>
    <rect x="94" y="115" width="14" height="3.5" rx="1.6" fill="#2a2f35"/>

    <!-- upright column -->
    <rect x="92" y="16" width="8.5" height="99" rx="1.6" fill="url(#lpSteel)"/>
    <!-- top pulley arm, angled down toward where the bar hangs -->
    <path d="M95 20 L59 27 l1.6 4.6 L96 25 z" fill="url(#lpSteel)"/>
    <circle cx="59.5" cy="29" r="3.4" fill="#5a626d"/><circle cx="59.5" cy="29" r="1.3" fill="#20242a"/>
    <circle cx="95" cy="22" r="3" fill="#5a626d"/><circle cx="95" cy="22" r="1.1" fill="#20242a"/>

    <!-- selector plate housing and the stack inside it -->
    <rect x="84.5" y="50" width="15.5" height="62" rx="2" fill="#23272d"/>
    <g fill="#33383f">
      <rect x="86.5" y="52" width="11.5" height="4.6" rx="1.2"/>
      <rect x="86.5" y="58" width="11.5" height="4.6" rx="1.2"/>
      <rect x="86.5" y="64" width="11.5" height="4.6" rx="1.2"/>
      <rect x="86.5" y="70" width="11.5" height="4.6" rx="1.2"/>
      <rect x="86.5" y="76" width="11.5" height="4.6" rx="1.2"/>
      <rect x="86.5" y="82" width="11.5" height="4.6" rx="1.2"/>
      <rect x="86.5" y="88" width="11.5" height="4.6" rx="1.2"/>
      <rect x="86.5" y="94" width="11.5" height="4.6" rx="1.2"/>
      <rect x="86.5" y="100" width="11.5" height="4.6" rx="1.2"/>
      <rect x="86.5" y="106" width="11.5" height="4.6" rx="1.2"/>
    </g>
    <!-- guide rods -->
    <rect x="88.6" y="50" width="1" height="62" fill="#6d757f"/>
    <rect x="95.4" y="50" width="1" height="62" fill="#6d757f"/>

    <!-- bench: long pad, upright support, and the frame under it -->
    <rect x="62" y="96" width="5.5" height="19" rx="1.4" fill="url(#lpSteel)"/>
    <rect x="28" y="91.5" width="42" height="5.5" rx="2.4" fill="url(#lpPad)"/>
    <rect x="29.5" y="92.5" width="39" height="1.4" rx="0.7" fill="#3a4049" opacity=".55"/>
  </g>

  <g id="front">
    <!-- thigh pads: the body goes behind these, which is what pins the knees -->
    <rect x="63.5" y="70" width="4" height="12" rx="1.4" fill="url(#lpSteel)"/>
    <rect x="57" y="69.5" width="15" height="7.5" rx="3.75" fill="url(#lpPad)"/>
    <rect x="57" y="78.5" width="15" height="7.5" rx="3.75" fill="url(#lpPad)"/>
    <rect x="58.5" y="70.6" width="12" height="1.6" rx="0.8" fill="#434a54" opacity=".5"/>
    <rect x="58.5" y="79.6" width="12" height="1.6" rx="0.8" fill="#434a54" opacity=".5"/>
  </g>
</svg>
