<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <!-- Seated leg extension, side view, rig space (floor y=118). The user faces
       right: seat under the hips at y 94, a reclined back pad, the weight
       stack behind it, handles by the hips, and the knee axis bracket at the
       front edge of the seat. The moving shin pad is a lever prop, not here. -->
  <defs>
    <linearGradient id="leSteel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b4149"/><stop offset=".5" stop-color="#4b525c"/><stop offset="1" stop-color="#343a41"/>
    </linearGradient>
    <linearGradient id="lePad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f35"/><stop offset="1" stop-color="#16191d"/>
    </linearGradient>
  </defs>

  <g id="back">
    <!-- base rail and feet -->
    <rect x="12" y="114" width="86" height="4" rx="1.6" fill="url(#leSteel)"/>
    <rect x="8" y="115" width="14" height="3.5" rx="1.6" fill="#2a2f35"/>
    <rect x="86" y="115" width="14" height="3.5" rx="1.6" fill="#2a2f35"/>

    <!-- weight stack tower behind the back pad -->
    <rect x="13" y="30" width="18" height="86" rx="2" fill="#23272d"/>
    <rect x="13" y="30" width="18" height="3.2" rx="1.4" fill="#454c56"/>
    <g fill="#33383f">
      <rect x="15" y="60" width="14" height="4.6" rx="1.2"/>
      <rect x="15" y="66" width="14" height="4.6" rx="1.2"/>
      <rect x="15" y="72" width="14" height="4.6" rx="1.2"/>
      <rect x="15" y="78" width="14" height="4.6" rx="1.2"/>
      <rect x="15" y="84" width="14" height="4.6" rx="1.2"/>
      <rect x="15" y="90" width="14" height="4.6" rx="1.2"/>
      <rect x="15" y="96" width="14" height="4.6" rx="1.2"/>
      <rect x="15" y="102" width="14" height="4.6" rx="1.2"/>
      <rect x="15" y="108" width="14" height="4.6" rx="1.2"/>
    </g>
    <rect x="17.5" y="33" width="1" height="82" fill="#6d757f"/>
    <rect x="25.5" y="33" width="1" height="82" fill="#6d757f"/>
    <rect x="19" y="46" width="6" height="1.6" rx="0.8" fill="#8b95a2"/>

    <!-- rear upright from the tower to the back pad, and the seat spine -->
    <rect x="31" y="62" width="4.5" height="54" rx="1.4" fill="#30363d"/>
    <path d="M31 66 l4 -3 v10 l-4 3 z" fill="#30363d"/>
    <rect x="36" y="99" width="42" height="4.5" rx="1.6" fill="url(#leSteel)"/>
    <rect x="53" y="103" width="6" height="12" rx="1.4" fill="url(#leSteel)"/>
    <rect x="54" y="103.8" width="1.6" height="10.5" rx="0.8" fill="#5c646f"/>

    <!-- knee axis bracket at the front edge of the seat -->
    <path d="M74 103 l5 -18 h5 l-2 18 z" fill="#30363d"/>
    <rect x="76.5" y="86" width="5" height="17" rx="1.4" fill="url(#leSteel)"/>

    <!-- back pad, reclined a few degrees, and the seat pad -->
    <rect x="34.5" y="59" width="6.8" height="40" rx="2.8" fill="url(#lePad)" transform="rotate(-5 38 98)"/>
    <rect x="36" y="60.5" width="1.5" height="36" rx="0.75" fill="#3a4049" opacity=".6" transform="rotate(-5 38 98)"/>
    <rect x="37" y="94" width="38" height="5.6" rx="2.6" fill="url(#lePad)"/>
    <rect x="38.5" y="95" width="35" height="1.4" rx="0.7" fill="#3a4049" opacity=".55"/>

    <!-- far side handle, dimmed -->
    <rect x="45" y="99.4" width="14" height="2.6" rx="1.3" fill="#5d6672"/>
  </g>

  <g id="front">
    <!-- near side handle by the hip: the hand goes behind this grip -->
    <rect x="53" y="101" width="3" height="4" rx="1" fill="#30363d"/>
    <rect x="45" y="98.6" width="15" height="3" rx="1.5" fill="#8b95a2"/>
    <rect x="46.5" y="99.1" width="12" height="0.9" rx="0.45" fill="#b4bcc6"/>
  </g>
</svg>
