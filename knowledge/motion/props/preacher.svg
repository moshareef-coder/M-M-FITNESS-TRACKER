<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <!-- Preacher curl bench, side view, in the rig's 140-unit space with the
       floor at y=118. The arm pad is the old inclined bench prop exactly
       (centre line 53.6,59 to 84.4,87.6, 5.6 thick), the seat is the old flat
       bench (26,96 to 60,96), so the upper arms and hips land where they did.
       #back is behind the body, #front over it. -->
  <defs>
    <linearGradient id="pcSteel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b4149"/><stop offset=".5" stop-color="#4b525c"/><stop offset="1" stop-color="#343a41"/>
    </linearGradient>
  </defs>

  <g id="back">
    <!-- base rail and rubber feet -->
    <rect x="22" y="114.8" width="70" height="3.2" rx="1.4" fill="url(#pcSteel)"/>
    <rect x="22" y="116.4" width="3.2" height="1.6" rx=".6" fill="#16191d"/>
    <rect x="88.8" y="116.4" width="3.2" height="1.6" rx=".6" fill="#16191d"/>

    <!-- seat post with its height pin holes -->
    <rect x="40.5" y="97" width="5" height="18.5" rx="1.2" fill="url(#pcSteel)"/>
    <circle cx="43" cy="103" r=".7" fill="#20242a"/>
    <circle cx="43" cy="106.5" r=".7" fill="#20242a"/>
    <circle cx="43" cy="110" r=".7" fill="#20242a"/>

    <!-- front upright that carries the arm pad, and the brace to its top edge -->
    <rect x="77.5" y="84" width="5" height="31.5" rx="1.2" fill="url(#pcSteel)"/>
    <path d="M80 97 L51.7 61.2" stroke="#3b4149" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M80 97 L51.7 61.2" stroke="#4b525c" stroke-width="1" stroke-linecap="round" opacity=".6"/>

    <!-- bar holder off the front of the upright -->
    <rect x="82" y="99" width="8.5" height="2.6" rx="1" fill="#454c56"/>
    <rect x="88.4" y="94.5" width="2.4" height="7" rx=".9" fill="#5c646f"/>

    <!-- seat pad -->
    <path d="M26 96 L60 96" stroke="#20242a" stroke-width="5.6" stroke-linecap="round"/>
    <path d="M28.2 94.5 L57.8 94.5" stroke="#3a4049" stroke-width="1.1" stroke-linecap="round" opacity=".7"/>
  </g>

  <g id="front">
    <!-- the sloped arm pad: the upper arms lie on it, the chest and near
         thigh sit behind it -->
    <path d="M53.6 59 L84.4 87.6" stroke="#20242a" stroke-width="5.6" stroke-linecap="round"/>
    <path d="M56.2 59.4 L83.8 85" stroke="#3a4049" stroke-width="1.1" stroke-linecap="round" opacity=".7"/>
  </g>
</svg>
