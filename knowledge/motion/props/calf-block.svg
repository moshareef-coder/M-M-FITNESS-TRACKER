<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <!-- A calf raise block, side view: a steel step with a ribbed rubber top so
       the ball of the foot grips while the heel hangs off the back. Drawn at
       x 42..72 with its top at y=104 (the Donkey Calf Raise spot); slide it
       with dx for the standing raises. Floor at y=118. -->
  <defs>
    <linearGradient id="cbSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b525c"/><stop offset="1" stop-color="#343a41"/>
    </linearGradient>
  </defs>
  <g id="back">
    <rect x="42" y="104" width="30" height="14" rx="2" fill="url(#cbSteel)"/>
    <rect x="43.2" y="105.2" width="27.6" height="9.4" rx="1.2" fill="#30363d"/>
    <rect x="42" y="104" width="30" height="3.4" rx="1.6" fill="#16191d"/>
    <path d="M45 104.8 v1.8 M48 104.8 v1.8 M51 104.8 v1.8 M54 104.8 v1.8 M57 104.8 v1.8 M60 104.8 v1.8 M63 104.8 v1.8 M66 104.8 v1.8 M69 104.8 v1.8" stroke="#3a4049" stroke-width="0.8" stroke-linecap="round"/>
    <rect x="42" y="115.6" width="30" height="2.4" rx="1" fill="#16191d"/>
  </g>
  <g id="front"></g>
</svg>
