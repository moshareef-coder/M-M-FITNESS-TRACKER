<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <!-- Plate loaded seated leg press (Hammer Strength PL-SLP shape), side view,
       in the rig's 140-unit space with the floor at y=118. The fixed parts only:
       base, seat, reclined back pad, seat handle, the front bracket the plate
       arm hinges on. The footplate is a held sprite (leg-press-sled.svg) on a
       lever prop from the pivot at (89,91). -->
  <defs>
    <linearGradient id="lpSteel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b4149"/><stop offset=".5" stop-color="#4b525c"/><stop offset="1" stop-color="#343a41"/>
    </linearGradient>
    <linearGradient id="lpPad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f35"/><stop offset="1" stop-color="#16191d"/>
    </linearGradient>
  </defs>

  <g id="back">
    <!-- base rail with rubber feet -->
    <rect x="8" y="114" width="116" height="4" rx="1.6" fill="url(#lpSteel)"/>
    <rect x="10" y="115.2" width="14" height="3.4" rx="1.6" fill="#2a2f35"/>
    <rect x="60" y="115.2" width="14" height="3.4" rx="1.6" fill="#2a2f35"/>
    <rect x="108" y="115.2" width="14" height="3.4" rx="1.6" fill="#2a2f35"/>

    <!-- rear upright and the angled tube that carries the back pad -->
    <rect x="11" y="46" width="5" height="70" rx="1.4" fill="url(#lpSteel)"/>
    <rect x="11.8" y="47" width="1.3" height="68" rx="0.6" fill="#5c646f" opacity=".6"/>
    <line x1="31" y1="95" x2="13.5" y2="45" stroke="#454c56" stroke-width="3.2" stroke-linecap="round"/>
    <line x1="30" y1="93.5" x2="13" y2="45.5" stroke="#5c646f" stroke-width="0.9" stroke-linecap="round" opacity=".7"/>

    <!-- seat frame: two posts under the pan -->
    <rect x="35" y="97" width="4.6" height="18" rx="1.3" fill="url(#lpSteel)"/>
    <rect x="58" y="94" width="4.6" height="21" rx="1.3" fill="url(#lpSteel)"/>
    <!-- seat handle: a chrome grip beside the pan, where the hands hang -->
    <rect x="46" y="96" width="2.4" height="6" rx="1" fill="#30363d"/>
    <line x1="40.5" y1="101.6" x2="55.5" y2="101.6" stroke="#8b95a2" stroke-width="3" stroke-linecap="round"/>
    <line x1="41.5" y1="100.9" x2="54.5" y2="100.9" stroke="#b4bcc6" stroke-width="0.8" stroke-linecap="round"/>

    <!-- seat pan, a touch higher at the knee end -->
    <line x1="33.5" y1="97" x2="61.5" y2="94" stroke="#20242a" stroke-width="5.4" stroke-linecap="round"/>
    <line x1="36" y1="95.4" x2="59" y2="92.9" stroke="#3a4049" stroke-width="1.1" stroke-linecap="round" opacity=".7"/>
    <!-- back pad, reclined along the torso -->
    <line x1="34.5" y1="92" x2="18" y2="41" stroke="#20242a" stroke-width="5.8" stroke-linecap="round"/>
    <line x1="35.5" y1="89.5" x2="19.7" y2="42.5" stroke="#3a4049" stroke-width="1.1" stroke-linecap="round" opacity=".7"/>

    <!-- front bracket the footplate arm pivots on -->
    <path d="M82 114 h14 l-3 -26 h-8 z" fill="url(#lpSteel)"/>
    <rect x="86" y="88" width="1.2" height="24" rx="0.5" fill="#5c646f" opacity=".5"/>
  </g>
</svg>
