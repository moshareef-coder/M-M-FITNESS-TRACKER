<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <!-- Seated shoulder press (Life Fitness Signature style), side view, user
       faces right. Rig space: 140 units, floor at y=118. Taller back pad than
       the chest press; the press arms are lever props hinged at (27,58),
       behind the shoulders at shoulder height. -->
  <defs>
    <linearGradient id="spSteel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b4149"/><stop offset=".5" stop-color="#4b525c"/><stop offset="1" stop-color="#343a41"/>
    </linearGradient>
    <linearGradient id="spPad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f35"/><stop offset="1" stop-color="#16191d"/>
    </linearGradient>
  </defs>

  <g id="back">
    <!-- base rail and rubber feet -->
    <rect x="6" y="114" width="70" height="4" rx="1.6" fill="url(#spSteel)"/>
    <rect x="7" y="115.5" width="12" height="3.5" rx="1.6" fill="#2a2f35"/>
    <rect x="62" y="115.5" width="12" height="3.5" rx="1.6" fill="#2a2f35"/>

    <!-- weight stack shroud behind the machine, plates and guide rods -->
    <rect x="6" y="31" width="19" height="4.2" rx="1.4" fill="url(#spSteel)"/>
    <rect x="7" y="34" width="17" height="80" rx="2" fill="#23272d"/>
    <g fill="#33383f">
      <rect x="9" y="42" width="13" height="4.6" rx="1.2"/>
      <rect x="9" y="48" width="13" height="4.6" rx="1.2"/>
      <rect x="9" y="54" width="13" height="4.6" rx="1.2"/>
      <rect x="9" y="60" width="13" height="4.6" rx="1.2"/>
      <rect x="9" y="66" width="13" height="4.6" rx="1.2"/>
      <rect x="9" y="72" width="13" height="4.6" rx="1.2"/>
      <rect x="9" y="78" width="13" height="4.6" rx="1.2"/>
      <rect x="9" y="84" width="13" height="4.6" rx="1.2"/>
      <rect x="9" y="90" width="13" height="4.6" rx="1.2"/>
      <rect x="9" y="96" width="13" height="4.6" rx="1.2"/>
      <rect x="9" y="102" width="13" height="4.6" rx="1.2"/>
    </g>
    <rect x="11.6" y="34" width="1" height="80" fill="#6d757f"/>
    <rect x="19.4" y="34" width="1" height="80" fill="#6d757f"/>

    <!-- rear upright, the top cap that holds the tall back pad, and the
         press-arm pivot block at shoulder height -->
    <rect x="25" y="26" width="6.5" height="90" rx="1.6" fill="url(#spSteel)"/>
    <rect x="25" y="26" width="12" height="4.6" rx="1.6" fill="url(#spSteel)"/>
    <rect x="23.5" y="53.5" width="8" height="9" rx="1.6" fill="#30363d"/>
    <rect x="29" y="72" width="7" height="4" rx="1.2" fill="url(#spSteel)"/>

    <!-- seat post with its height pin, then the seat -->
    <rect x="51.5" y="97" width="6" height="18" rx="1.5" fill="url(#spSteel)"/>
    <circle cx="54.5" cy="105" r="1.4" fill="#8b95a2"/>
    <rect x="39" y="92.5" width="32" height="5.5" rx="2.4" fill="url(#spPad)"/>
    <rect x="40.5" y="93.5" width="29" height="1.4" rx="0.7" fill="#3a4049" opacity=".55"/>

    <!-- tall back pad up to head height, reclined to lie along the torso -->
    <g transform="rotate(-8.5 45 96)">
      <rect x="34.5" y="36" width="4.5" height="58" rx="1.2" fill="url(#spSteel)"/>
      <rect x="38" y="33" width="7" height="63" rx="2.6" fill="url(#spPad)"/>
      <rect x="39.2" y="35" width="1.4" height="59" rx="0.7" fill="#3a4049" opacity=".55"/>
    </g>
  </g>

  <g id="front">
  </g>
</svg>
