<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <!-- Seated chest press (Life Fitness Signature style), side view, user faces
       right. Rig space: 140 units, floor at y=118. The press arms are lever
       props in the move, hinged at the overhead pivot (43,14) behind the head.
       #back sits behind the body, #front in front of it. -->
  <defs>
    <linearGradient id="cpSteel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b4149"/><stop offset=".5" stop-color="#4b525c"/><stop offset="1" stop-color="#343a41"/>
    </linearGradient>
    <linearGradient id="cpPad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f35"/><stop offset="1" stop-color="#16191d"/>
    </linearGradient>
  </defs>

  <g id="back">
    <!-- base rail and rubber feet -->
    <rect x="8" y="114" width="70" height="4" rx="1.6" fill="url(#cpSteel)"/>
    <rect x="9" y="115.5" width="12" height="3.5" rx="1.6" fill="#2a2f35"/>
    <rect x="64" y="115.5" width="12" height="3.5" rx="1.6" fill="#2a2f35"/>

    <!-- weight stack shroud behind the machine, plates and guide rods -->
    <rect x="8" y="37" width="19" height="4.2" rx="1.4" fill="url(#cpSteel)"/>
    <rect x="9" y="40" width="17" height="74" rx="2" fill="#23272d"/>
    <g fill="#33383f">
      <rect x="11" y="48" width="13" height="4.6" rx="1.2"/>
      <rect x="11" y="54" width="13" height="4.6" rx="1.2"/>
      <rect x="11" y="60" width="13" height="4.6" rx="1.2"/>
      <rect x="11" y="66" width="13" height="4.6" rx="1.2"/>
      <rect x="11" y="72" width="13" height="4.6" rx="1.2"/>
      <rect x="11" y="78" width="13" height="4.6" rx="1.2"/>
      <rect x="11" y="84" width="13" height="4.6" rx="1.2"/>
      <rect x="11" y="90" width="13" height="4.6" rx="1.2"/>
      <rect x="11" y="96" width="13" height="4.6" rx="1.2"/>
      <rect x="11" y="102" width="13" height="4.6" rx="1.2"/>
    </g>
    <rect x="13.6" y="40" width="1" height="74" fill="#6d757f"/>
    <rect x="21.4" y="40" width="1" height="74" fill="#6d757f"/>

    <!-- rear upright and the top arm that carries the press-arm pivot -->
    <rect x="27" y="12" width="6.5" height="104" rx="1.6" fill="url(#cpSteel)"/>
    <rect x="27" y="11.5" width="20" height="5" rx="1.8" fill="url(#cpSteel)"/>
    <circle cx="43" cy="14" r="4.2" fill="#30363d"/>
    <!-- bracket from the upright to the back pad -->
    <rect x="31" y="70" width="7" height="4" rx="1.2" fill="url(#cpSteel)"/>

    <!-- seat post with its height pin, then the seat -->
    <rect x="51.5" y="97" width="6" height="18" rx="1.5" fill="url(#cpSteel)"/>
    <circle cx="54.5" cy="105" r="1.4" fill="#8b95a2"/>
    <rect x="39" y="92.5" width="32" height="5.5" rx="2.4" fill="url(#cpPad)"/>
    <rect x="40.5" y="93.5" width="29" height="1.4" rx="0.7" fill="#3a4049" opacity=".55"/>

    <!-- back pad, reclined a few degrees to lie along the torso -->
    <g transform="rotate(-8.5 45 96)">
      <rect x="34.5" y="52" width="4.5" height="42" rx="1.2" fill="url(#cpSteel)"/>
      <rect x="38" y="50" width="7" height="46" rx="2.6" fill="url(#cpPad)"/>
      <rect x="39.2" y="52" width="1.4" height="42" rx="0.7" fill="#3a4049" opacity=".55"/>
    </g>

    <!-- foot pedal in front of the seat post, used to lift the handles into reach -->
    <rect x="63" y="106" width="2.4" height="9" rx="1" fill="url(#cpSteel)"/>
    <rect x="59" y="103.5" width="10" height="3" rx="1.2" fill="#2a2f35" transform="rotate(-22 64 105)"/>
  </g>

  <g id="front">
  </g>
</svg>
