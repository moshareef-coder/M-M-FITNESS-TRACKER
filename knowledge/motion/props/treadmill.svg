<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <!-- Treadmill, side view, runner facing +x.

       THIS ONE DOES NOT SIT ON y=118. Every other machine here stands on the
       rig's floor line and grows upward; a treadmill's belt IS the floor as far
       as the runner is concerned, so the belt has to be where the feet already
       land or the gait is running in mid air. The belt top is therefore at 116.4
       and the machine hangs BELOW the rig's floor line, which is why the move
       sets `floor: false` and the base carries its own faded floor line at 127.
       Move either one without the other and the floor cuts across the belt.

       Geometry the runner is authored against, and the reason nothing in RUN
       had to change: the sole reaches y=120.25 at footstrike and the stride
       runs from toe x=25 to x=87, so the belt spans 12..124 and is deep enough
       (116.4 to 120.2) to carry a foot without the sole hanging under it.

       The console is in #back on purpose. Side on, the runner's arms are at his
       sides and the console is on the machine's centre line, so the hand passes
       in FRONT of the screen: the swing reaches x=106 at y=32, right across it.
       The near side rail is the one thing in #front, because that rail really
       is between you and the runner. -->
  <defs>
    <linearGradient id="tmSteel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b4149"/><stop offset=".5" stop-color="#4b525c"/><stop offset="1" stop-color="#343a41"/>
    </linearGradient>
    <linearGradient id="tmBelt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f353d"/><stop offset="1" stop-color="#1b1f24"/>
    </linearGradient>
    <linearGradient id="tmFloor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b4149" stop-opacity="0"/>
      <stop offset=".18" stop-color="#3b4149" stop-opacity=".5"/>
      <stop offset=".82" stop-color="#3b4149" stop-opacity=".5"/>
      <stop offset="1" stop-color="#3b4149" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g id="back">
    <!-- the floor the machine stands on, drawn here because the rig's own is off -->
    <rect x="4" y="126.2" width="132" height="1.5" rx="0.75" fill="url(#tmFloor)"/>

    <!-- motor cowl: the hump under the console, sloping back to the deck -->
    <path d="M96 120.2 C104 120.2 108 114 114 110 L126 110 L126 120.2 Z" fill="#2f343b"/>
    <path d="M97.6 119 C104.6 119 108.4 113.4 113.6 111 L124.6 111 L124.6 119 Z" fill="none" stroke="#434a53" stroke-width="1"/>

    <!-- deck: the belt the feet land on, then the side frame under it -->
    <rect x="12" y="116.4" width="112" height="3.8" rx="1.6" fill="url(#tmBelt)"/>
    <rect x="13.4" y="116.8" width="109" height="0.9" rx="0.45" fill="#6b7480" opacity=".4"/>
    <rect x="10" y="120.2" width="116" height="4.2" rx="1.8" fill="url(#tmSteel)"/>
    <rect x="11.4" y="121" width="113" height="1" rx="0.5" fill="#5c646f" opacity=".45"/>
    <!-- the rollers the belt runs on, just proud of each end -->
    <circle cx="16.4" cy="118.3" r="2.4" fill="#454c56"/>
    <circle cx="119.6" cy="118.3" r="2.4" fill="#454c56"/>

    <!-- feet -->
    <rect x="15" y="124.4" width="18" height="2.2" rx="1" fill="#2a2f35"/>
    <rect x="102" y="124.4" width="20" height="2.2" rx="1" fill="#2a2f35"/>

    <!-- console mast and the screen the runner reads -->
    <rect x="108" y="50" width="6" height="62" rx="2.4" fill="url(#tmSteel)"/>
    <rect x="109.4" y="52" width="1.5" height="58" rx="0.7" fill="#5c646f" opacity=".5"/>
    <rect x="98" y="30" width="26" height="20" rx="3" fill="#2b3037"/>
    <rect x="100" y="32.4" width="22" height="12" rx="1.6" fill="#161a1f"/>
    <rect x="101.6" y="34.2" width="9" height="1.8" rx="0.9" fill="#3be76b" opacity=".85"/>
    <rect x="101.6" y="37.6" width="15" height="1.5" rx="0.75" fill="#5c646f" opacity=".7"/>
    <rect x="101.6" y="40.8" width="11" height="1.5" rx="0.75" fill="#5c646f" opacity=".55"/>

    <!-- far side rail. Both rails cantilever off the console mast and rake
         down toward the back of the deck, which is what a treadmill rail does
         and what keeps this from reading as scaffolding round his legs -->
    <path d="M110 64.5 L86 71.5" fill="none" stroke="#3b4149" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g id="front">
    <!-- The near side rail is the one part of this machine that is genuinely
         between you and the runner, so it is the one part drawn over him. It
         stops well short of his hips: the arm swing comes down to y=66 and the
         thigh drives through here, and a rail run the length of the deck read
         as a cage around his legs rather than something to grab on the way off. -->
    <path d="M112 68.5 L84 76" fill="none" stroke="#4b525c" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M110.6 67.8 L86 74.4" fill="none" stroke="#6b7480" stroke-width="1" stroke-linecap="round" opacity=".55"/>
  </g>
</svg>
