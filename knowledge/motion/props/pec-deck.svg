<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <!-- Pec fly / rear delt machine, seen from the front, in the rig's 140-unit
       space with the floor at y=118. The figure sits at x=70 with the hips at
       y=80, so the seat is at y=80, level with them, so he sits ON it; it used
       to be drawn at 86 and he floated above it.
       The two swing arms are lever props (pivots at 37,8 and 103,8 under the
       head beam) so they follow the hands; only the still frame lives here.
       #back is behind the body. #front is empty: nothing on this machine sits
       between the user and the camera except the near swing arm. -->
  <defs>
    <linearGradient id="pdSteel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#30363d"/><stop offset=".5" stop-color="#5c646f"/><stop offset="1" stop-color="#454c56"/>
    </linearGradient>
    <linearGradient id="pdPad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#31363d"/><stop offset="1" stop-color="#16191d"/>
    </linearGradient>
  </defs>

  <g id="back">
    <!-- base frame on the floor -->
    <rect x="24" y="114.5" width="94" height="3.5" rx="1.6" fill="#30363d"/>
    <rect x="22" y="115.5" width="14" height="2.5" rx="1.2" fill="#262a30"/>
    <rect x="104" y="115.5" width="14" height="2.5" rx="1.2" fill="#262a30"/>

    <!-- weight stack tower behind, to one side, shrouded -->
    <rect x="103" y="12" width="16" height="103" rx="2" fill="#23272d"/>
    <rect x="103" y="12" width="16" height="3.4" rx="1.2" fill="#454c56"/>
    <rect x="107.6" y="16" width="1" height="96" fill="#6d757f"/>
    <rect x="113.4" y="16" width="1" height="96" fill="#6d757f"/>
    <g fill="#33383f">
      <rect x="105" y="50" width="12" height="4.6" rx="1.2"/>
      <rect x="105" y="56" width="12" height="4.6" rx="1.2"/>
      <rect x="105" y="62" width="12" height="4.6" rx="1.2"/>
      <rect x="105" y="68" width="12" height="4.6" rx="1.2"/>
      <rect x="105" y="74" width="12" height="4.6" rx="1.2"/>
      <rect x="105" y="80" width="12" height="4.6" rx="1.2"/>
      <rect x="105" y="86" width="12" height="4.6" rx="1.2"/>
      <rect x="105" y="92" width="12" height="4.6" rx="1.2"/>
      <rect x="105" y="98" width="12" height="4.6" rx="1.2"/>
      <rect x="105" y="104" width="12" height="4.6" rx="1.2"/>
    </g>
    <!-- selector pin on the top plate -->
    <rect x="109" y="49" width="4" height="2.4" rx="1" fill="#8b95a2"/>

    <!-- main mast, from the base up to the head, behind the back pad -->
    <rect x="66.5" y="5" width="7" height="110" rx="1.6" fill="url(#pdSteel)"/>

    <!-- head: the beam over the user that carries the two arm pivots -->
    <rect x="31" y="4" width="78" height="7.5" rx="3.6" fill="url(#pdSteel)"/>
    <rect x="33" y="5" width="74" height="1.4" rx="0.7" fill="#5c646f" opacity=".6"/>
    <!-- link from the head across to the stack tower -->
    <rect x="98" y="6" width="12" height="4" rx="1.4" fill="#454c56"/>
    <!-- pivot housings; the lever props draw the pins over these -->
    <circle cx="37" cy="8" r="5.2" fill="#30363d"/>
    <circle cx="103" cy="8" r="5.2" fill="#30363d"/>

    <!-- back pad: narrow, tall, rounded; the torso covers most of it -->
    <rect x="61" y="38" width="18" height="44" rx="3.6" fill="url(#pdPad)"/>
    <rect x="63" y="39.5" width="14" height="1.6" rx="0.8" fill="#3a4049" opacity=".55"/>
    <rect x="62.2" y="41" width="1.2" height="39" rx="0.6" fill="#3a4049" opacity=".45"/>
    <rect x="76.6" y="41" width="1.2" height="39" rx="0.6" fill="#3a4049" opacity=".45"/>

    <!-- seat post with the height pin holes, then the seat pad -->
    <rect x="66.5" y="85" width="7" height="30" rx="1.4" fill="url(#pdSteel)"/>
    <circle cx="70" cy="97" r="0.9" fill="#20242a"/>
    <circle cx="70" cy="101.5" r="0.9" fill="#20242a"/>
    <circle cx="70" cy="106" r="0.9" fill="#20242a"/>
    <rect x="64" y="112" width="12" height="3" rx="1.3" fill="#30363d"/>
    <rect x="51" y="80" width="38" height="5.6" rx="2.8" fill="url(#pdPad)"/>
    <rect x="53" y="81" width="34" height="1.5" rx="0.75" fill="#3a4049" opacity=".55"/>
  </g>

  <g id="front">
  </g>
</svg>
