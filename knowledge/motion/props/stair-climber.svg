<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <!-- Stepmill, side view, rider facing +x, floor at y=118.

       The steps on a real stepmill revolve, and a moving part cannot live in an
       SVG. It does not need to: the rider stays at one height while the stairs
       come down to meet them, so the two step treads drawn here are where the
       feet actually go, and the animation alternates between them. That is what
       the machine looks like in a still and what it feels like to stand on.

       Geometry the rider is authored against: the upper tread at y=96 and the
       lower at y=108, both around x 60..84, and the side rail at y=62, running fore and aft beside the rider at hip height. -->
  <defs>
    <linearGradient id="scSteel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b4149"/><stop offset=".5" stop-color="#4b525c"/><stop offset="1" stop-color="#343a41"/>
    </linearGradient>
  </defs>

  <g id="back">
    <!-- base and the housing the staircase runs inside -->
    <rect x="46" y="112" width="74" height="6" rx="2" fill="url(#scSteel)"/>
    <rect x="48" y="115.6" width="14" height="2.8" rx="1.3" fill="#2a2f35"/>
    <rect x="104" y="115.6" width="14" height="2.8" rx="1.3" fill="#2a2f35"/>
    <path d="M52 112 L52 100 L92 76 L104 76 L104 112 Z" fill="#2f343b"/>
    <path d="M53.4 110.6 L53.4 100.8 L92.6 77.4 L102.6 77.4 L102.6 110.6 Z" fill="none" stroke="#434a53" stroke-width="1"/>

    <!-- the two treads the feet stand on, and the risers between them -->
    <rect x="58" y="104" width="28" height="4.4" rx="1.2" fill="#4b525c"/>
    <rect x="59" y="104.6" width="26" height="1.1" rx="0.5" fill="#6b7480" opacity=".55"/>
    <rect x="62" y="92" width="28" height="4.4" rx="1.2" fill="#4b525c"/>
    <rect x="63" y="92.6" width="26" height="1.1" rx="0.5" fill="#6b7480" opacity=".55"/>
    <rect x="86" y="80" width="26" height="4.4" rx="1.2" fill="#454c56" opacity=".85"/>

    <!-- console mast and screen, the thing the rider faces -->
    <rect x="103" y="42" width="6" height="72" rx="2.4" fill="url(#scSteel)"/>
    <rect x="104.4" y="44" width="1.5" height="68" rx="0.7" fill="#5c646f" opacity=".5"/>
    <rect x="96" y="30" width="22" height="16" rx="3" fill="#2b3037"/>
    <rect x="98" y="32.4" width="18" height="9.4" rx="1.6" fill="#161a1f"/>
    <rect x="99.4" y="34" width="8" height="1.6" rx="0.8" fill="#3be76b" opacity=".85"/>
    <rect x="99.4" y="37" width="12" height="1.4" rx="0.7" fill="#5c646f" opacity=".7"/>

    <!-- side rails: the horizontal the hands rest on, and its stanchion -->
    <rect x="58" y="60.6" width="46" height="3.4" rx="1.7" fill="url(#scSteel)"/>
    <rect x="59" y="61.2" width="43" height="1" rx="0.5" fill="#6b7480" opacity=".5"/>
    <path d="M60 62 C55 66 55 74 59 79" fill="none" stroke="#454c56" stroke-width="3.2" stroke-linecap="round"/>
    <line x1="99" y1="62" x2="99" y2="78" stroke="#454c56" stroke-width="3.2" stroke-linecap="round"/>
  </g>
</svg>
