<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 66" width="60" height="66">
  <!-- The hack squat sled: back pad, shoulder pads, carriage, slider blocks and
       the loaded horn. A held sprite, 60 x 66 figure units, pinned to the
       shoulder: the shoulder point sits at (40,18) in here, 10 in front of the
       pad face and just under the shoulder pad. Drawn in #back: the body lies
       on top of it. -->
  <g id="back">
    <!-- plates on the horn, outboard of the carriage -->
    <circle cx="9" cy="42" r="10" fill="#1d2126"/>
    <circle cx="12" cy="42" r="10" fill="#262a30"/>
    <circle cx="12" cy="42" r="10" fill="none" stroke="#3a4048" stroke-width="1.1"/>
    <circle cx="12" cy="42" r="6.6" fill="none" stroke="#3a4048" stroke-width="0.8" opacity=".8"/>
    <circle cx="12" cy="42" r="2.8" fill="#16191d"/>
    <circle cx="12" cy="42" r="1.8" fill="#8b95a2"/>
    <!-- carriage tube along the pad, and the two slider blocks on the rail -->
    <rect x="20" y="9" width="4.6" height="52" rx="1.4" fill="#454c56"/>
    <rect x="20.7" y="10" width="1.2" height="50" rx="0.5" fill="#5c646f" opacity=".6"/>
    <rect x="15" y="12" width="10" height="9" rx="1.6" fill="#30363d"/>
    <rect x="15" y="48" width="10" height="9" rx="1.6" fill="#30363d"/>
    <!-- yoke out to the shoulder pad -->
    <rect x="22" y="7.5" width="14" height="3.6" rx="1.4" fill="#454c56"/>
    <rect x="34" y="6.5" width="3.4" height="7" rx="1.2" fill="#454c56"/>
    <!-- far side shoulder pad; the near one is hack-squat-pad.svg, in front -->
    <rect x="31" y="6" width="19" height="6.4" rx="3.2" fill="#16191d"/>
    <!-- back pad -->
    <rect x="25" y="5" width="5.4" height="58" rx="2.4" fill="#20242a"/>
    <rect x="26" y="7" width="1.3" height="54" rx="0.6" fill="#3a4049" opacity=".7"/>
  </g>
</svg>
