<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 48" width="44" height="48">
  <!-- The moving footplate of the seated leg press: a held sprite, 44 x 48
       figure units, pinned to the toe. The platform face is the left edge of the
       slab at x=8 (14 left of the sprite centre); the carriage and the plate
       horn with its discs ride above it. Drawn in #front because the prop is
       placed with front: true. -->
  <g id="front">
    <!-- carriage from the plate back to the horn -->
    <path d="M13 5 h11 a2 2 0 0 1 2 2 v13 a2 2 0 0 1 -2 2 h-11 z" fill="#454c56"/>
    <rect x="13.6" y="6" width="1.4" height="15" rx="0.6" fill="#5c646f" opacity=".6"/>
    <!-- two discs on the horn, the far one peeking out -->
    <circle cx="29" cy="12" r="10" fill="#1d2126"/>
    <circle cx="26" cy="12" r="10" fill="#262a30"/>
    <circle cx="26" cy="12" r="10" fill="none" stroke="#3a4048" stroke-width="1.1"/>
    <circle cx="26" cy="12" r="6.6" fill="none" stroke="#3a4048" stroke-width="0.8" opacity=".8"/>
    <circle cx="26" cy="12" r="2.8" fill="#16191d"/>
    <circle cx="26" cy="12" r="1.8" fill="#8b95a2"/>
    <circle cx="25.6" cy="11.6" r="0.6" fill="#b4bcc6"/>
    <!-- the platform slab, face toward the user on the left -->
    <rect x="8" y="3" width="5" height="42" rx="1.5" fill="#454c56"/>
    <rect x="8.5" y="4" width="1.3" height="40" rx="0.6" fill="#5c646f"/>
    <rect x="11.7" y="4" width="0.9" height="40" rx="0.4" fill="#30363d"/>
    <!-- heel lip at the bottom of the plate -->
    <rect x="6.2" y="42.6" width="7" height="2.4" rx="1" fill="#30363d"/>
  </g>
</svg>
