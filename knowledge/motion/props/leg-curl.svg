<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <!-- Lying (prone) leg curl, side view, rig space (floor y=118). The user
       lies head to the right: a thigh pad sloping down toward the knees, the
       raised hump under the hips, the chest pad sloping toward the head,
       handles under the front, the knee pivot bracket beside the knees and
       the weight stack at the foot end. The moving ankle pad is a lever. -->
  <defs>
    <linearGradient id="lcSteel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b4149"/><stop offset=".5" stop-color="#4b525c"/><stop offset="1" stop-color="#343a41"/>
    </linearGradient>
    <linearGradient id="lcPad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f35"/><stop offset="1" stop-color="#16191d"/>
    </linearGradient>
  </defs>

  <g id="back">
    <!-- base rail and feet -->
    <rect x="4" y="114" width="118" height="4" rx="1.6" fill="url(#lcSteel)"/>
    <rect x="2" y="115" width="14" height="3.5" rx="1.6" fill="#2a2f35"/>
    <rect x="108" y="115" width="14" height="3.5" rx="1.6" fill="#2a2f35"/>

    <!-- weight stack at the foot end -->
    <rect x="1" y="38" width="14" height="78" rx="2" fill="#23272d"/>
    <rect x="1" y="38" width="14" height="3" rx="1.4" fill="#454c56"/>
    <g fill="#33383f">
      <rect x="2.6" y="66" width="10.8" height="4.6" rx="1.2"/>
      <rect x="2.6" y="72" width="10.8" height="4.6" rx="1.2"/>
      <rect x="2.6" y="78" width="10.8" height="4.6" rx="1.2"/>
      <rect x="2.6" y="84" width="10.8" height="4.6" rx="1.2"/>
      <rect x="2.6" y="90" width="10.8" height="4.6" rx="1.2"/>
      <rect x="2.6" y="96" width="10.8" height="4.6" rx="1.2"/>
      <rect x="2.6" y="102" width="10.8" height="4.6" rx="1.2"/>
      <rect x="2.6" y="108" width="10.8" height="4.6" rx="1.2"/>
    </g>
    <rect x="4.6" y="41" width="1" height="74" fill="#6d757f"/>
    <rect x="10.4" y="41" width="1" height="74" fill="#6d757f"/>
    <rect x="5.5" y="52" width="5" height="1.6" rx="0.8" fill="#8b95a2"/>

    <!-- uprights: foot end (knee pivot bracket), under the hump, head end -->
    <rect x="34" y="88" width="5.5" height="28" rx="1.4" fill="url(#lcSteel)"/>
    <path d="M36 92 l7 -5 h4 l-2 8 h-9 z" fill="#30363d"/>
    <rect x="68" y="102" width="6" height="14" rx="1.4" fill="url(#lcSteel)"/>
    <rect x="69" y="103" width="1.6" height="12" rx="0.8" fill="#5c646f"/>
    <rect x="102" y="102" width="5.5" height="14" rx="1.4" fill="url(#lcSteel)"/>
    <!-- spine under the pads -->
    <rect x="30" y="101" width="92" height="3.6" rx="1.4" fill="url(#lcSteel)"/>

    <!-- thigh pad sloping down toward the knees -->
    <rect x="29" y="97.2" width="40" height="5.6" rx="2.6" fill="url(#lcPad)" transform="rotate(-3.5 69 100)"/>
    <rect x="31" y="98.2" width="36" height="1.3" rx="0.65" fill="#3a4049" opacity=".55" transform="rotate(-3.5 69 100)"/>
    <!-- hip hump -->
    <rect x="62" y="95.4" width="22" height="7.4" rx="3.6" fill="url(#lcPad)"/>
    <rect x="65" y="96.4" width="16" height="1.3" rx="0.65" fill="#3a4049" opacity=".55"/>
    <!-- chest pad sloping toward the head -->
    <rect x="80" y="97.2" width="42" height="5.6" rx="2.6" fill="url(#lcPad)" transform="rotate(3 80 100)"/>
    <rect x="83" y="98.2" width="37" height="1.3" rx="0.65" fill="#3a4049" opacity=".55" transform="rotate(3 80 100)"/>

    <!-- far side handle, dimmed -->
    <rect x="51" y="95.2" width="14" height="2.6" rx="1.3" fill="#5d6672"/>
  </g>

  <g id="front">
    <!-- near side handle under the front of the pad -->
    <rect x="61" y="96.5" width="3" height="5" rx="1" fill="#30363d"/>
    <rect x="50" y="94.6" width="15" height="3" rx="1.5" fill="#8b95a2"/>
    <rect x="51.5" y="95.1" width="12" height="0.9" rx="0.45" fill="#b4bcc6"/>
  </g>
</svg>
