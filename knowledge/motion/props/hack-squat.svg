<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <!-- Plate loaded linear hack squat (Hammer Strength shape), side view, in the
       rig's 140-unit space with the floor at y=118. The fixed parts only: base,
       rear upright, the two rails the sled runs on, the bottom stop, and the
       foot platform. The sled (back pad, shoulder pads, carriage, plates) is a
       held sprite, hack-squat-sled.svg, pinned to the shoulder. -->
  <defs>
    <linearGradient id="hsSteel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b4149"/><stop offset=".5" stop-color="#4b525c"/><stop offset="1" stop-color="#343a41"/>
    </linearGradient>
  </defs>

  <g id="back">
    <!-- base rail with rubber feet -->
    <rect x="10" y="114" width="102" height="4" rx="1.6" fill="url(#hsSteel)"/>
    <rect x="12" y="115.2" width="14" height="3.4" rx="1.6" fill="#2a2f35"/>
    <rect x="96" y="115.2" width="14" height="3.4" rx="1.6" fill="#2a2f35"/>

    <!-- rear upright and the brace out to the top of the rails -->
    <rect x="12" y="8" width="5" height="108" rx="1.4" fill="url(#hsSteel)"/>
    <rect x="12.8" y="9" width="1.3" height="106" rx="0.6" fill="#5c646f" opacity=".6"/>
    <line x1="14.5" y1="11" x2="21" y2="11" stroke="#454c56" stroke-width="4" stroke-linecap="round"/>
    <line x1="14.5" y1="60" x2="36" y2="60" stroke="#30363d" stroke-width="3" stroke-linecap="round"/>
    <!-- mid post under the rails -->
    <rect x="35.5" y="58" width="4.6" height="58" rx="1.3" fill="url(#hsSteel)"/>

    <!-- the rails: far one first, then the near one, both at the pad angle -->
    <line x1="17.5" y1="7.5" x2="52" y2="102" stroke="#30363d" stroke-width="3.6" stroke-linecap="round"/>
    <line x1="20.5" y1="8.5" x2="55" y2="103" stroke="#454c56" stroke-width="4.6" stroke-linecap="round"/>
    <line x1="19.3" y1="9.4" x2="53.8" y2="103.9" stroke="#5c646f" stroke-width="1" stroke-linecap="round" opacity=".7"/>
    <!-- bottom stop and top cap -->
    <rect x="50" y="104" width="10" height="5" rx="1.6" fill="#16191d"/>
    <rect x="17.5" y="4" width="6.5" height="5" rx="1.6" fill="#30363d"/>

    <!-- foot platform, flat where the feet already are (sole at y=103.4) -->
    <rect x="70" y="103.4" width="36" height="3.4" rx="1.2" fill="url(#hsSteel)"/>
    <rect x="71" y="103.9" width="34" height="1" rx="0.5" fill="#5c646f" opacity=".6"/>
    <rect x="75" y="106.5" width="4.4" height="9" rx="1.2" fill="url(#hsSteel)"/>
    <rect x="98" y="106.5" width="4.4" height="9" rx="1.2" fill="url(#hsSteel)"/>
    <line x1="57" y1="105.5" x2="72" y2="105.5" stroke="#454c56" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
