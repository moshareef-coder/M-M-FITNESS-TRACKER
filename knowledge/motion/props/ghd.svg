<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <!-- Glute-ham developer, side view, in the rig's 140-unit space with the
       floor at y=118. The figure faces right: the half-moon split thigh pad
       is under the knees at x 37..62, the foot plate and the two ankle
       rollers behind the feet at x 8..25. #back is behind the body, #front
       (the near thigh pad and the near rollers) is over it. -->
  <defs>
    <linearGradient id="ghdSteel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b4149"/><stop offset=".5" stop-color="#4b525c"/><stop offset="1" stop-color="#343a41"/>
    </linearGradient>
    <linearGradient id="ghdPad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f35"/><stop offset="1" stop-color="#16191d"/>
    </linearGradient>
  </defs>

  <g id="back">
    <!-- base rail on the floor with rubber feet -->
    <rect x="2" y="113.6" width="80" height="4.4" rx="2" fill="url(#ghdSteel)"/>
    <rect x="3" y="115.6" width="12" height="2.4" rx="1.1" fill="#16191d"/>
    <rect x="70" y="115.6" width="12" height="2.4" rx="1.1" fill="#16191d"/>

    <!-- rear upright carrying the foot plate and the roller carriage -->
    <rect x="2.6" y="72" width="5.6" height="43" rx="1.4" fill="url(#ghdSteel)"/>
    <!-- laser cut steel foot plate, standing just ahead of the upright -->
    <rect x="7.6" y="73" width="2.4" height="34" rx="0.7" fill="#5c646f"/>
    <rect x="8" y="73.4" width="0.7" height="33.2" rx="0.3" fill="#8b95a2" opacity=".6"/>
    <rect x="9.3" y="73.4" width="0.5" height="33.2" fill="#30363d" opacity=".7"/>
    <!-- roller carriage: arm from the plate to the axle bar between the rollers -->
    <rect x="9" y="87.2" width="13.6" height="2.8" rx="1" fill="url(#ghdSteel)"/>
    <rect x="20.4" y="80.6" width="2.6" height="15.6" rx="1" fill="url(#ghdSteel)"/>

    <!-- length adjustment rail: box sleeve from the pad post, chrome slide
         rod back to the rear upright, pop pin on the sleeve -->
    <rect x="8" y="105.8" width="22" height="2.6" rx="1.3" fill="#8b95a2"/>
    <rect x="8" y="106.2" width="22" height="0.8" rx="0.4" fill="#b4bcc6" opacity=".6"/>
    <rect x="28" y="104.6" width="24" height="5" rx="1.2" fill="url(#ghdSteel)"/>
    <rect x="31.2" y="101.2" width="1.6" height="3.8" fill="#5c646f"/>
    <circle cx="32" cy="100.6" r="1.7" fill="#454c56"/><circle cx="32" cy="100.6" r="0.7" fill="#5c646f"/>

    <!-- pad post and the steel plate the thigh pad sits on -->
    <rect x="45.5" y="100" width="7" height="15" rx="1.4" fill="url(#ghdSteel)"/>
    <rect x="36" y="102.8" width="27" height="2.4" rx="1" fill="#30363d"/>
    <!-- front brace down to the base -->
    <path d="M50 106 L74 114.6 L72.4 116.4 L48.6 108.2 z" fill="#3b4149"/>
    <!-- the pair of sit-up handles under the front of the pad -->
    <rect x="52" y="106.4" width="19" height="2.6" rx="1.3" fill="url(#ghdSteel)"/>
    <rect x="63" y="105.9" width="8.5" height="3.6" rx="1.8" fill="#16191d"/>
  </g>

  <g id="front">
    <!-- near half of the split half-moon thigh pad: the knees sit on its
         back slope, the thighs lie over its top at the bottom of the rep -->
    <path d="M36.5 103.4 A12.5 10 0 0 1 61.5 103.4 z" fill="url(#ghdPad)"/>
    <path d="M40 98.6 A9.6 6.6 0 0 1 58 98.6" fill="none" stroke="#3a4049" stroke-width="1.1" opacity=".55"/>
    <!-- near ankle rollers, above and below the ankle, seen end on -->
    <circle cx="21.7" cy="82.2" r="3.5" fill="url(#ghdPad)"/>
    <circle cx="21.7" cy="82.2" r="1.1" fill="#5c646f"/>
    <path d="M19.4 81 A3 3 0 0 1 24 81" fill="none" stroke="#3a4049" stroke-width="0.8" opacity=".6"/>
    <circle cx="21.7" cy="94.6" r="3.5" fill="url(#ghdPad)"/>
    <circle cx="21.7" cy="94.6" r="1.1" fill="#5c646f"/>
    <path d="M19.4 93.4 A3 3 0 0 1 24 93.4" fill="none" stroke="#3a4049" stroke-width="0.8" opacity=".6"/>
  </g>
</svg>
