<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 7" width="20" height="7">
  <!-- The near side shoulder pad of the hack squat sled, 20 x 7 figure units,
       pinned to the shoulder with front: true so it sits over the shoulder in
       front of the neck the way the near pad really does. -->
  <g id="front">
    <rect x="0.5" y="0.4" width="19" height="6.2" rx="3.1" fill="#20242a"/>
    <rect x="3" y="1.5" width="14" height="1.3" rx="0.6" fill="#3a4049" opacity=".7"/>
  </g>
</svg>
