<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <!-- 45 degree hyperextension bench, side view, in the rig's 140-unit space
       with the floor at y=118. The user lies face down on it with the head at
       +x: thighs on the angled hip pad, soles on the foot plate at the low end,
       rollers behind the calves. #back is the frame, plate, handles and the
       under side of the pad; #front is the near thigh pad and the near roller,
       which the legs go behind. -->
  <defs>
    <linearGradient id="beSteel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b4149"/><stop offset=".5" stop-color="#4b525c"/><stop offset="1" stop-color="#343a41"/>
    </linearGradient>
    <linearGradient id="bePad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f35"/><stop offset="1" stop-color="#16191d"/>
    </linearGradient>
  </defs>

  <g id="back">
    <!-- base rail with rubber feet at each end -->
    <rect x="12" y="114.5" width="66" height="3.5" rx="1.5" fill="url(#beSteel)"/>
    <rect x="11" y="115.5" width="10" height="3" rx="1.4" fill="#2a2f35"/>
    <rect x="63" y="115.5" width="12" height="3" rx="1.4" fill="#2a2f35"/>

    <!-- rear post: carries the foot plate and the roller bracket -->
    <rect x="17.8" y="91" width="4.8" height="25" rx="1.4" fill="url(#beSteel)"/>
    <!-- foot plate, edge on, angled to meet the soles at 90 degrees to the shin -->
    <g transform="translate(20.6 90.5) rotate(75)">
      <rect x="0" y="0" width="18.5" height="3.2" rx="1" fill="#3a4049"/>
      <rect x="1" y="0.5" width="16.5" height="1" rx="0.5" fill="#5c646f" opacity=".6"/>
    </g>
    <!-- roller bracket up from the post, the far roller behind the calves -->
    <path d="M18.9 92.6 L24.9 85.2 l2.6 2.1 L21.5 94.7 z" fill="#454c56"/>
    <circle cx="25.3" cy="84.8" r="4.5" fill="#1c2024"/>

    <!-- inclined main beam from the rear base up under the hip pad -->
    <path d="M19 113.6 L62 82.6 l2.4 3.4 L21.4 117 z" fill="url(#beSteel)"/>
    <path d="M19.6 112.6 L62.1 82 l0.8 1.1 L20.4 113.7 z" fill="#5c646f" opacity=".55"/>

    <!-- front upright under the hip pad -->
    <rect x="66" y="80" width="5.4" height="36" rx="1.5" fill="url(#beSteel)"/>
    <rect x="66.8" y="80.8" width="1.4" height="34.4" rx="0.7" fill="#5c646f" opacity=".5"/>
    <!-- handles under the front of the pad, rubber grips -->
    <path d="M67 85.4 L80.2 90.4 l-1.2 3 L65.8 88.4 z" fill="#454c56"/>
    <rect x="74" y="88" width="9" height="4.6" rx="2.3" transform="rotate(21 78.5 90.3)" fill="#16191d"/>
    <rect x="75" y="88.6" width="7" height="1.2" rx="0.6" transform="rotate(21 78.5 90.3)" fill="#31363d"/>

    <!-- steel plate the hip pad bolts to -->
    <g transform="translate(55.05 83.55) rotate(-45)">
      <rect x="1.5" y="6.3" width="16" height="2.6" rx="0.9" fill="#30363d"/>
    </g>
  </g>

  <g id="front">
    <!-- hip pad: the thighs lie face down on it, so it sits over the near leg -->
    <g transform="translate(55.05 83.55) rotate(-45)">
      <rect x="0" y="0" width="19" height="6.6" rx="3" fill="url(#bePad)"/>
      <rect x="2" y="1" width="15" height="1.5" rx="0.75" fill="#3a4049" opacity=".6"/>
    </g>
    <!-- near roller behind the calf, with its axle -->
    <circle cx="26.3" cy="84.8" r="4.6" fill="#20242a"/>
    <circle cx="26.3" cy="84.8" r="3.2" fill="#2b2f35"/>
    <circle cx="26.3" cy="84.8" r="1.2" fill="#8b95a2"/>
  </g>
</svg>
