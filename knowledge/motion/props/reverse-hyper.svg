<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <!-- Reverse hyper, side view, in the rig's 140-unit space with the floor at
       y=118. A tall padded table the torso lies on face down with the head at
       +x, handles out the front, the pendulum pivot under the rear edge of the
       pad. The swinging arm and its roller are a lever prop in the move, not
       drawn here, because they move with the legs. -->
  <defs>
    <linearGradient id="rhSteel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b4149"/><stop offset=".5" stop-color="#4b525c"/><stop offset="1" stop-color="#343a41"/>
    </linearGradient>
    <linearGradient id="rhPad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f35"/><stop offset="1" stop-color="#16191d"/>
    </linearGradient>
  </defs>

  <g id="back">
    <!-- base rail with rubber feet -->
    <rect x="60" y="114.5" width="58" height="3.5" rx="1.5" fill="url(#rhSteel)"/>
    <rect x="59" y="115.5" width="12" height="3" rx="1.4" fill="#2a2f35"/>
    <rect x="105" y="115.5" width="12" height="3" rx="1.4" fill="#2a2f35"/>

    <!-- rear and front uprights -->
    <rect x="66" y="63" width="6" height="53" rx="1.5" fill="url(#rhSteel)"/>
    <rect x="66.8" y="63.8" width="1.5" height="51.4" rx="0.7" fill="#5c646f" opacity=".5"/>
    <rect x="104" y="63" width="6" height="53" rx="1.5" fill="url(#rhSteel)"/>
    <rect x="104.8" y="63.8" width="1.5" height="51.4" rx="0.7" fill="#5c646f" opacity=".5"/>
    <!-- lower cross member on the far side -->
    <rect x="70" y="98" width="36" height="3" rx="1.2" fill="#30363d"/>

    <!-- pivot bracket for the pendulum, under the rear edge of the pad -->
    <rect x="57" y="61" width="14" height="5.5" rx="1.2" fill="#30363d"/>

    <!-- steel top plate and the pad on it -->
    <rect x="62" y="61" width="50" height="2.8" rx="0.9" fill="#30363d"/>
    <rect x="60" y="54.6" width="54" height="6.8" rx="3.2" fill="url(#rhPad)"/>
    <rect x="62.5" y="55.6" width="49" height="1.5" rx="0.75" fill="#3a4049" opacity=".6"/>

    <!-- handles out the front at pad height, with rubber grips -->
    <path d="M108 59.2 L133 56.6 l0.3 3.2 L108 62.4 z" fill="#454c56"/>
    <path d="M108.6 59.6 L132.8 57.1 l0.1 0.9 L108.7 60.5 z" fill="#5c646f" opacity=".5"/>
    <rect x="123" y="55.6" width="11.5" height="4.8" rx="2.4" transform="rotate(-6 128.75 58)" fill="#16191d"/>
    <rect x="124" y="56.3" width="9.5" height="1.2" rx="0.6" transform="rotate(-6 128.75 58)" fill="#31363d"/>
  </g>

  <g id="front">
  </g>
</svg>
