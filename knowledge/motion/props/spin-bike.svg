<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <!-- Upright studio spin bike, side view, rider facing +x, in the rig's
       140-unit space with the floor at y=118.

       Fixed parts only. The crank arms and pedals rotate, so they are not here:
       each one is a `lever` prop from the bottom bracket at (70,96) to that
       ankle, drawn by rig.mjs. The hub circle below sits under them.

       Geometry the rider is authored against, do not move one without the
       other: bottom bracket (70,96), saddle top y=52 at x 48..70, bar tops
       around (88,52). -->
  <defs>
    <linearGradient id="sbSteel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b4149"/><stop offset=".5" stop-color="#4b525c"/><stop offset="1" stop-color="#343a41"/>
    </linearGradient>
    <linearGradient id="sbWheel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a626d"/><stop offset="1" stop-color="#333940"/>
    </linearGradient>
  </defs>

  <g id="back">
    <!-- stabilisers: rear under the saddle, front under the flywheel -->
    <rect x="30" y="113.4" width="40" height="4.6" rx="2" fill="url(#sbSteel)"/>
    <rect x="31" y="115.4" width="10" height="3.2" rx="1.5" fill="#2a2f35"/>
    <rect x="59" y="115.4" width="10" height="3.2" rx="1.5" fill="#2a2f35"/>
    <rect x="84" y="113.4" width="38" height="4.6" rx="2" fill="url(#sbSteel)"/>
    <rect x="85" y="115.4" width="10" height="3.2" rx="1.5" fill="#2a2f35"/>
    <rect x="111" y="115.4" width="10" height="3.2" rx="1.5" fill="#2a2f35"/>

    <!-- seat post, raked back a little, and the saddle on top -->
    <rect x="54.4" y="54" width="5.2" height="60" rx="2" fill="url(#sbSteel)"/>
    <rect x="55.6" y="56" width="1.4" height="56" rx="0.7" fill="#5c646f" opacity=".55"/>
    <path d="M47 52.6h20.5c2.2 0 3.2 1.1 3.2 2.4 0 1.5-1.6 2.6-4.2 2.6H50c-2.4 0-3.6-1-3.6-2.5 0-1.4 0.9-2.5 0.6-2.5z" fill="#20242a"/>
    <path d="M47.4 52.2h20c2 0 3 1 3 2.2 0 1.3-1.4 2.3-3.8 2.3H50.2c-2.2 0-3.3-0.9-3.3-2.2 0-1.2 0.8-2.3 0.5-2.3z" fill="#2f353d"/>

    <!-- the tube from the seat post down to the bottom bracket -->
    <line x1="57" y1="96" x2="70" y2="96" stroke="#454c56" stroke-width="4" stroke-linecap="round"/>

    <!-- handlebar post and the bars: a flat top bar with the forward horns -->
    <rect x="85.4" y="52" width="5.2" height="62" rx="2" fill="url(#sbSteel)"/>
    <rect x="86.6" y="54" width="1.4" height="58" rx="0.7" fill="#5c646f" opacity=".55"/>
    <line x1="79" y1="52.6" x2="97" y2="52.6" stroke="#454c56" stroke-width="3.4" stroke-linecap="round"/>
    <line x1="79" y1="51.8" x2="96" y2="51.8" stroke="#5c646f" stroke-width="0.9" stroke-linecap="round" opacity=".6"/>
    <line x1="93" y1="52.6" x2="99" y2="46" stroke="#454c56" stroke-width="3.2" stroke-linecap="round"/>

    <!-- the down tube from the bars to the flywheel shroud -->
    <line x1="88" y1="62" x2="99" y2="84" stroke="#454c56" stroke-width="4.2" stroke-linecap="round"/>

    <!-- flywheel, its shroud and the resistance knob -->
    <circle cx="101" cy="90" r="14.2" fill="url(#sbWheel)"/>
    <circle cx="101" cy="90" r="14.2" fill="none" stroke="#272c32" stroke-width="1.4"/>
    <circle cx="101" cy="90" r="9.4" fill="none" stroke="#272c32" stroke-width="0.9" opacity=".7"/>
    <circle cx="101" cy="90" r="3" fill="#5c646f"/>
    <circle cx="101" cy="90" r="1.2" fill="#c9ced6"/>
    <path d="M89 82.5c4-5.5 19-5.5 23 0" fill="none" stroke="#454c56" stroke-width="3.6" stroke-linecap="round"/>
    <rect x="92.2" y="70" width="3.4" height="7" rx="1.6" fill="#5c646f"/>

    <!-- bottom bracket housing, under the crank levers -->
    <circle cx="70" cy="96" r="4.6" fill="#454c56"/>
    <circle cx="70" cy="96" r="2.2" fill="#5c646f"/>
  </g>
</svg>
