<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <!-- Seated low row, side view, drawn to the rig's own 140-unit space with
       the floor at y=118. The user sits at the left facing right: long bench
       pad, angled foot plate in front of the toes, the low pulley on a
       bracket just past the plate, and the stack tower at the far end. The
       pulley wheel, the line and the V handle are drawn by the cable prop. -->
  <defs>
    <linearGradient id="srSteel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b4149"/><stop offset=".5" stop-color="#4b525c"/><stop offset="1" stop-color="#343a41"/>
    </linearGradient>
    <linearGradient id="srPad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f35"/><stop offset="1" stop-color="#16191d"/>
    </linearGradient>
  </defs>

  <g id="back">
    <!-- base rail along the floor, bench end to tower -->
    <rect x="10" y="114" width="126" height="4" rx="1.6" fill="url(#srSteel)"/>
    <rect x="8" y="115.2" width="14" height="2.8" rx="1.4" fill="#2a2f35"/>
    <rect x="118" y="115.2" width="18" height="2.8" rx="1.4" fill="#2a2f35"/>

    <!-- stack tower: column, housing, plates, guide rods, selector pin -->
    <rect x="120" y="34" width="8" height="82" rx="1.6" fill="url(#srSteel)"/>
    <rect x="118.5" y="32" width="11" height="4" rx="1.6" fill="#5c646f"/>
    <rect x="115" y="62" width="17" height="52" rx="2" fill="#23272d"/>
    <g fill="#33383f">
      <rect x="117" y="68" width="13" height="4.4" rx="1.2"/>
      <rect x="117" y="74" width="13" height="4.4" rx="1.2"/>
      <rect x="117" y="80" width="13" height="4.4" rx="1.2"/>
      <rect x="117" y="86" width="13" height="4.4" rx="1.2"/>
      <rect x="117" y="92" width="13" height="4.4" rx="1.2"/>
      <rect x="117" y="98" width="13" height="4.4" rx="1.2"/>
      <rect x="117" y="104" width="13" height="4.4" rx="1.2"/>
    </g>
    <rect x="119.4" y="62" width="1" height="52" fill="#6d757f"/>
    <rect x="126.6" y="62" width="1" height="52" fill="#6d757f"/>
    <rect x="132" y="70" width="4.2" height="1.5" rx="0.75" fill="#8b95a2"/>

    <!-- low pulley beam out of the tower foot, and the bracket the wheel sits in -->
    <rect x="104" y="100" width="18" height="3.6" rx="1.4" fill="url(#srSteel)"/>
    <rect x="106.2" y="92" width="3.6" height="10" rx="1.2" fill="#30363d"/>

    <!-- foot plate: a rubber-faced plate leaning back toward the user, on a bracket -->
    <path d="M91.5 118 L86 98.5 L90.5 98.5 L96 118 z" fill="url(#srSteel)"/>
    <path d="M91.5 118 L86 98.5 L88.2 98.5 L93.7 118 z" fill="#16191d"/>
    <g stroke="#3a4049" stroke-width="0.8" stroke-linecap="round">
      <line x1="87.2" y1="102.5" x2="88.7" y2="102.5"/>
      <line x1="88.1" y1="105.8" x2="89.6" y2="105.8"/>
      <line x1="89" y1="109.1" x2="90.5" y2="109.1"/>
      <line x1="89.9" y1="112.4" x2="91.4" y2="112.4"/>
    </g>
    <rect x="85.2" y="96.5" width="6.2" height="2.8" rx="1.2" fill="#5c646f"/>
    <path d="M92 118 L98 118 L98 108 L94.5 108 z" fill="#30363d"/>

    <!-- bench: spine tube, two uprights, the long pad -->
    <rect x="16" y="111" width="54" height="2.6" rx="1.3" fill="#454c56"/>
    <rect x="22" y="109" width="4.6" height="7" rx="1.2" fill="url(#srSteel)"/>
    <rect x="58" y="109" width="4.6" height="7" rx="1.2" fill="url(#srSteel)"/>
    <rect x="12" y="105.2" width="60" height="5.6" rx="2.6" fill="url(#srPad)"/>
    <rect x="14" y="106.2" width="56" height="1.3" rx="0.65" fill="#3a4049" opacity=".55"/>
  </g>

  <g id="front">
  </g>
</svg>
