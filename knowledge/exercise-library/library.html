<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fit Together — Exercise Library</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f5f2;
    --card: #ffffff;
    --border: #e3e0da;
    --text: #1a1a1a;
    --muted: #6b6660;
    --accent: #16181d;
    --chip: #f0eee9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101318;
      --card: #171b21;
      --border: #262b33;
      --text: #eceef0;
      --muted: #8b93a1;
      --accent: #d6dbe4;
      --chip: #1f242c;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { padding: 28px 20px 16px; max-width: 900px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; }
  .summary { display: flex; gap: 16px; margin-top: 14px; flex-wrap: wrap; }
  .summary .stat { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; }
  .summary .stat b { display: block; font-size: 18px; }
  .summary .stat span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
  main { max-width: 900px; margin: 0 auto; padding: 0 20px 60px; }
  .training { margin-top: 28px; }
  .training-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .training-head h2 { font-size: 19px; margin: 0; }
  .training-head .mode { font-size: 12px; color: var(--muted); border: 1px solid var(--border); border-radius: 100px; padding: 2px 9px; }
  .styles { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 4px; }
  .style-chip { font-size: 12px; background: var(--chip); border-radius: 100px; padding: 4px 10px; color: var(--muted); }
  .style-chip b { color: var(--text); font-weight: 600; }
  .category { margin-top: 14px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .category summary { list-style: none; cursor: pointer; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
  .category summary::-webkit-details-marker { display: none; }
  .category summary .count { color: var(--muted); font-weight: 400; font-size: 13px; }
  .ex-list { border-top: 1px solid var(--border); }
  .ex-row { padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); }
  .ex-row:last-child { border-bottom: none; }
  .ex-name { font-weight: 500; }
  .ex-meta { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .badge { font-size: 11px; padding: 3px 8px; border-radius: 100px; background: var(--chip); color: var(--muted); white-space: nowrap; }
  .badge.primary { background: var(--accent); color: var(--bg); }
  .level-beginner { opacity: .7; }
  .level-advanced { font-weight: 600; }
  .simple-note { margin-top: 32px; background: var(--card); border: 1px dashed var(--border); border-radius: 14px; padding: 16px; color: var(--muted); font-size: 13px; }
  .simple-note b { color: var(--text); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .chip { font-size: 12px; background: var(--chip); border-radius: 100px; padding: 4px 10px; }
</style>
</head>
<body>
<header>
  <h1>Exercise Library — draft for review</h1>
  <div class="sub">Training → Workout Category → Exercise. Muscle keys match the app's existing heat map, so this can plug in directly once approved.</div>
  <div class="summary" id="summary"></div>
</header>
<main id="main"></main>

<script type="module">
  import { TRAININGS, SIMPLE_TIMED_ACTIVITIES } from "./index.mjs";

  const badge = (text, cls = "") => `<span class="badge ${cls}">${text}</span>`;

  function renderExercise(ex) {
    const primary = (ex.primary || []).map((m) => badge(m, "primary")).join("");
    const secondary = (ex.secondary || []).map((m) => badge(m)).join("");
    const equip = ex.equipment ? badge(ex.equipment) : "";
    const level = ex.level ? `<span class="badge level-${ex.level}">${ex.level}</span>` : "";
    return `<div class="ex-row">
      <div class="ex-name">${ex.name}</div>
      <div class="ex-meta">${primary}${secondary}${equip}${level}</div>
    </div>`;
  }

  function renderCategory(cat) {
    return `<details class="category">
      <summary><span>${cat.label}</span><span class="count">${cat.exercises.length} exercises</span></summary>
      <div class="ex-list">${cat.exercises.map(renderExercise).join("")}</div>
    </details>`;
  }

  function renderTraining(t) {
    const styles = t.styles
      ? `<div class="styles">${t.styles.map((s) => `<span class="style-chip"><b>${s.label}</b> — ${s.note}</span>`).join("")}</div>`
      : "";
    return `<section class="training">
      <div class="training-head">
        <h2>${t.label}</h2>
        <span class="mode">${t.trackingMode === "sets" ? "sets × reps × weight" : "logged by duration"}</span>
      </div>
      ${styles}
      ${t.categories.map(renderCategory).join("")}
    </section>`;
  }

  const main = document.getElementById("main");
  main.innerHTML = TRAININGS.map(renderTraining).join("") + `
    <div class="simple-note">
      <b>Logged by duration, no exercise breakdown</b> — these don't decompose into discrete "exercises"
      the way lifting/yoga/Pilates do (you don't do "exercises within basketball"). Matches how the app
      already tracks them. Say the word if any of these should get a real library instead.
      <div class="chips">${SIMPLE_TIMED_ACTIVITIES.map((a) => `<span class="chip">${a}</span>`).join("")}</div>
    </div>`;

  const totalExercises = TRAININGS.reduce((sum, t) => sum + t.categories.reduce((s, c) => s + c.exercises.length, 0), 0);
  const totalCategories = TRAININGS.reduce((sum, t) => sum + t.categories.length, 0);
  document.getElementById("summary").innerHTML = `
    <div class="stat"><b>${TRAININGS.length}</b><span>Trainings built</span></div>
    <div class="stat"><b>${totalCategories}</b><span>Categories</span></div>
    <div class="stat"><b>${totalExercises}</b><span>Exercises / poses / moves</span></div>
    <div class="stat"><b>${SIMPLE_TIMED_ACTIVITIES.length}</b><span>Simple timed activities</span></div>
  `;
</script>
</body>
</html>
