<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fit Together Motion Lab</title>
<link rel="icon" href="/icon-192.png">
<style>
/* Sibling of engine-lab.html and sandbox.html: same workbench, different
   subject. This one runs knowledge/motion against the real exercise library so
   an author can see what is drawn, what is missing, and whether a pose reads.
   Dark first because that is where the app lives and where the figure has to
   look right. */
:root {
  --bg: #0b0d11;
  --panel: #14171d;
  --panel-2: #1b1f26;
  --line: #262b34;
  --ink: #f4f6f8;
  --ink-2: #c3cbd6;
  --mut: #8b94a3;
  --accent: #a8ff00;
  --accent-ink: #a8ff00;
  --on-accent: #0b0d11;
  --r: 12px;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
}
html[data-accent="stretch"] { --accent: #2ea8ff; --accent-ink: #6cc4ff; --on-accent: #04121f; }
html[data-theme="light"] {
  --bg: #f5f7fa; --panel: #ffffff; --panel-2: #eef1f5; --line: #e4e8ee;
  --ink: #111318; --ink-2: #333a45; --mut: #686d7c;
  --accent: #3be76b; --accent-ink: #0f7a38; --on-accent: #052a17;
}
html[data-theme="light"][data-accent="stretch"] { --accent: #0b7fc7; --accent-ink: #0a6ba8; --on-accent: #fff; }
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans);
  font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
.wrap { max-width: 1220px; margin: 0 auto; padding: 22px 22px 60px; }

header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
.sub { color: var(--mut); font-size: 12.5px; }
.count { color: var(--mut); font-size: 12.5px; margin-left: auto; font-variant-numeric: tabular-nums; }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 16px 0 18px; }
.tab {
  background: var(--panel); border: 1px solid var(--line); color: var(--ink-2);
  border-radius: 999px; padding: 6px 13px; font-size: 12.5px; cursor: pointer;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 620; }
.tab .n { opacity: .6; font-variant-numeric: tabular-nums; }

.stage { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 18px; align-items: start; }
.viewer { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
#hero { width: 320px; height: 320px; display: block; margin: 0 auto; }
.vname { font-size: 15px; font-weight: 620; margin: 12px 2px 2px; }
.vmeta { color: var(--mut); font-size: 12px; margin: 0 2px 12px; }
.ctrl { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.ctrl label { font-size: 11.5px; color: var(--mut); min-width: 42px; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.val { font-size: 11.5px; color: var(--mut); font-variant-numeric: tabular-nums; min-width: 36px; text-align: right; }
.btn {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px;
  padding: 6px 12px; font-size: 12.5px; cursor: pointer;
}
.btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btnrow { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }

.info { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
.info h2 { margin: 0 0 2px; font-size: 15px; font-weight: 620; }
.info .tag { color: var(--mut); font-size: 12px; margin-bottom: 14px; }
.kv { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 6px 12px; font-size: 13px; }
.kv dt { color: var(--mut); font-size: 12px; }
.kv dd { margin: 0; color: var(--ink-2); }
.cue { margin-top: 14px; padding: 11px 13px; background: var(--panel-2); border-radius: 10px; font-size: 12.5px; color: var(--ink-2); }
.nomove { margin-top: 14px; font-size: 12.5px; color: var(--mut); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; margin-top: 20px; }
.cell {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 10px 10px 9px; cursor: pointer; text-align: left; min-height: 62px;
}
.cell:hover { border-color: var(--accent); }
.cell[aria-pressed="true"] { border-color: var(--accent); }
.cell.dim { opacity: .42; cursor: default; }
.cell.dim:hover { border-color: var(--line); }
.cell canvas { width: 100%; aspect-ratio: 1; display: block; }
.cell .n { font-size: 11.5px; font-weight: 560; line-height: 1.25; margin-top: 6px; }
.cell .s { font-size: 10.5px; color: var(--mut); }

/* contact sheet mode */
.sheet { padding: 18px; }
.sheet h1 { margin-bottom: 14px; }
.sgrid { display: grid; gap: 14px; }
.scard { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px; }
.srow { display: flex; gap: 6px; }
.srow canvas { width: 50%; aspect-ratio: 1; }
.scard .n { font-size: 11.5px; font-weight: 580; margin-top: 6px; }
.scard .s { font-size: 10.5px; color: var(--mut); }
#err {
  display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 9;
  background: #c8442f; color: #fff; font-family: var(--mono); font-size: 12px; padding: 8px 12px;
}
</style>
</head>
<body>
<div id="err"></div>
<div id="root"></div>

<script type="module">
import { TRAININGS } from "./knowledge/exercise-library/index.mjs";
import { mountMove, hasMove, moveFor, MOVE_NAMES, MOVES_BY_LIBRARY, samplePose, cameraFor } from "./knowledge/motion/index.mjs";

window.addEventListener("error", (e) => {
  const el = document.getElementById("err");
  el.style.display = "block";
  el.textContent = "ERROR " + (e.message || e.error);
});

const q = new URLSearchParams(location.search);
const root = document.getElementById("root");
const theme = q.get("theme") === "light" ? "light" : "dark";
const accent = q.get("accent") === "stretch" ? "stretch" : "action";
const skin = q.get("skin") === "anatomy" ? "anatomy" : "mannequin";
document.documentElement.dataset.theme = theme;
document.documentElement.dataset.accent = accent;

const entries = new Map();   // name -> { entry, training, category }
for (const tr of TRAININGS) {
  for (const cat of tr.categories || []) {
    for (const ex of cat.exercises || []) {
      if (!entries.has(ex.name)) entries.set(ex.name, { entry: ex, training: tr, category: cat });
    }
  }
}

// --------------------------------------------------------- contact sheet ----
// Every authored move in a library at the two ends of its cycle, side by side,
// for one screenshot. This is the view that catches a pose that validates but
// does not read.
// Muscles a move works, for the anatomy skin comparison sheet. Small hand
// written map rather than reading the library's primary/secondary, because the
// library uses the same keys but names a few groups the plates do not have.
const LIT = {
  "Push-Up": ["chest", "triceps", "shoulders"],
  "Goblet Squat": ["quads", "glutes"],
  "Doorway Pec Stretch": ["chest", "shoulders"],
  "Warrior II": ["quads", "glutes", "shoulders"],
  "Pull-Up": ["lats", "biceps"],
  "Barbell Bench Press": ["chest", "triceps"],
  "Lat Pulldown": ["lats", "biceps"],
  "Step-Up": ["glutes", "quads"],
  "Band Pull-Apart": ["traps", "shoulders"],
  "Foam Roller Thoracic Extension": ["traps", "lats"],
};
const LIT_COLOR = "#e0521f"; // level3 from APP_HEAT_PALETTE

// Side by side skins for the four moves Mo already signed off on.
if (q.get("sheet") === "compare") {
  const names = ["Push-Up", "Goblet Squat", "Doorway Pec Stretch", "Warrior II"];
  root.className = "sheet";
  root.innerHTML = `<h1>skins <span class="sub">mannequin then anatomy, each at t = 0 and t = 0.5, muscles lit</span></h1>
    <div class="sgrid" style="grid-template-columns: repeat(2, minmax(0,1fr))"></div>`;
  const grid = root.querySelector(".sgrid");
  for (const name of names) {
    const card = document.createElement("div");
    card.className = "scard";
    card.innerHTML = `<div class="srow"><canvas></canvas><canvas></canvas><canvas></canvas><canvas></canvas></div>
      <div class="n">${name}</div><div class="s">mannequin &middot; mannequin &middot; anatomy &middot; anatomy</div>`;
    grid.appendChild(card);
    const cvs = card.querySelectorAll("canvas");
    for (const c of cvs) c.style.width = "25%";
    const combos = [["mannequin", 0], ["mannequin", 0.5], ["anatomy", 0], ["anatomy", 0.5]];
    combos.forEach(([sk, t], i) => {
      const anim = mountMove(cvs[i], name, {
        theme, accent, skin: sk, paused: true,
        lit: sk === "anatomy" ? { muscles: LIT[name] || [], color: LIT_COLOR } : null,
      });
      if (anim) anim.seek(t);
    });
  }
  requestAnimationFrame(() => requestAnimationFrame(() => { window.__sheetReady = true; }));
} else if (q.get("sheet")) {
  const libId = q.get("sheet");
  const cols = Math.max(1, Math.min(8, parseInt(q.get("cols") || "6", 10)));
  const lib = MOVES_BY_LIBRARY[libId] || {};
  const names = Object.keys(lib).sort();
  root.className = "sheet";
  root.innerHTML = `<h1>${libId} <span class="sub">${names.length} authored, t = 0 and t = 0.5</span></h1>
    <div class="sgrid" style="grid-template-columns: repeat(${cols}, minmax(0,1fr))"></div>`;
  const grid = root.querySelector(".sgrid");
  for (const name of names) {
    const m = moveFor(name);
    const card = document.createElement("div");
    card.className = "scard";
    card.innerHTML = `<div class="srow"><canvas></canvas><canvas></canvas></div>
      <div class="n">${name}</div><div class="s">${typeof m.view === "object" ? `yaw ${m.view.yaw || 0}${m.view.pitch ? " pitch " + m.view.pitch : ""}` : (m.view || "side")} &middot; ${m.loop}</div>`;
    grid.appendChild(card);
    const [a, b] = card.querySelectorAll("canvas");
    for (const [cv, t] of [[a, 0], [b, 0.5]]) {
      const anim = mountMove(cv, name, { theme, accent, skin, paused: true });
      if (anim) anim.seek(t);
    }
  }
  requestAnimationFrame(() => requestAnimationFrame(() => { window.__sheetReady = true; }));
} else {
  buildLab();
}

// ------------------------------------------------------------------- lab ----
function buildLab() {
  const authored = MOVE_NAMES.length;
  root.className = "wrap";
  root.innerHTML = `
    <header>
      <h1>Motion Lab</h1>
      <span class="sub">every exercise in the library, and what is drawn for it</span>
      <span class="count">${authored} of ${entries.size} names authored</span>
    </header>
    <div class="tabs" id="tabs"></div>
    <div class="stage">
      <div class="viewer">
        <canvas id="hero" width="320" height="320"></canvas>
        <div class="vname" id="vname">Pick a move</div>
        <div class="vmeta" id="vmeta">&nbsp;</div>
        <div class="ctrl"><label for="scrub">t</label><input id="scrub" type="range" min="0" max="1" step="0.005" value="0"><span class="val" id="tval">0.00</span></div>
        <div class="ctrl"><label for="speed">speed</label><input id="speed" type="range" min="0.2" max="2" step="0.05" value="1"><span class="val" id="sval">1.0x</span></div>
        <div class="ctrl"><label for="yaw">yaw</label><input id="yaw" type="range" min="-180" max="180" step="1" value="0"><span class="val" id="yval">0</span></div>
        <div class="ctrl"><label for="pitch">pitch</label><input id="pitch" type="range" min="-90" max="90" step="1" value="0"><span class="val" id="pval">0</span></div>
        <div class="chans" id="chans"></div>
        <div class="btnrow">
          <button class="btn" id="play" aria-pressed="true">Pause</button>
          <button class="btn" id="accent" aria-pressed="${accent === "stretch"}">Stretch tint</button>
          <button class="btn" id="theme">${theme === "dark" ? "Light" : "Dark"}</button>
          <button class="btn" id="skin" aria-pressed="${skin === "anatomy"}">Anatomy skin</button>
        </div>
      </div>
      <div class="info" id="info"></div>
    </div>
    <div class="grid" id="grid"></div>`;

  const tabsEl = root.querySelector("#tabs");
  const gridEl = root.querySelector("#grid");
  const state = {
    lib: TRAININGS[0].id,
    name: q.get("name") || null,
    theme, accent, skin, yaw: 0, pitch: 0,
    playing: !q.has("t"),
    speed: 1,
    anim: null,
    cells: new Map(),
  };
  if (state.name && entries.has(state.name)) {
    const owner = TRAININGS.find((tr) => (tr.categories || []).some((c) => (c.exercises || []).some((e) => e.name === state.name)));
    if (owner) state.lib = owner.id;
  }

  for (const tr of TRAININGS) {
    const names = libNames(tr);
    const n = names.filter(hasMove).length;
    const b = document.createElement("button");
    b.className = "tab";
    b.innerHTML = `${tr.label} <span class="n">${n}/${names.length}</span>`;
    b.onclick = () => { state.lib = tr.id; renderTabs(); renderGrid(); };
    b.dataset.id = tr.id;
    tabsEl.appendChild(b);
  }

  function libNames(tr) {
    const out = [];
    for (const cat of tr.categories || []) for (const ex of cat.exercises || []) out.push(ex.name);
    return out;
  }
  function renderTabs() {
    for (const b of tabsEl.children) b.setAttribute("aria-pressed", String(b.dataset.id === state.lib));
  }

  function renderGrid() {
    for (const c of state.cells.values()) if (c.anim) c.anim.destroy();
    state.cells.clear();
    gridEl.innerHTML = "";
    const tr = TRAININGS.find((t) => t.id === state.lib);
    for (const name of libNames(tr)) {
      const has = hasMove(name);
      const cell = document.createElement("div");
      cell.className = "cell" + (has ? "" : " dim");
      cell.setAttribute("aria-pressed", String(name === state.name));
      cell.innerHTML = has
        ? `<canvas></canvas><div class="n">${name}</div>`
        : `<div class="n">${name}</div><div class="s">no move yet</div>`;
      gridEl.appendChild(cell);
      const rec = { el: cell, anim: null };
      state.cells.set(name, rec);
      if (has) {
        rec.anim = mountMove(cell.querySelector("canvas"), name, { theme: state.theme, accent: state.accent, skin: state.skin });
        cell.onclick = () => select(name);
      }
    }
  }

  function select(name) {
    state.name = name;
    for (const [n, rec] of state.cells) rec.el.setAttribute("aria-pressed", String(n === name));
    if (state.anim) state.anim.destroy();
    const hero = root.querySelector("#hero");
    state.anim = mountMove(hero, name, {
      theme: state.theme, accent: state.accent, skin: state.skin, paused: !state.playing,
      lit: state.skin === "anatomy" ? { muscles: LIT[name] || [], color: LIT_COLOR } : null,
    });
    if (state.anim) state.anim.setSpeed(state.speed);
    const move = moveFor(name);
    const info = entries.get(name);
    root.querySelector("#vname").textContent = name;
    const cam = move ? cameraFor(move.view) : null;
    root.querySelector("#vmeta").textContent = move
      ? `${cam.plane} plane, yaw ${cam.yaw}, pitch ${cam.pitch}, ${move.loop}, ${move.dur}s, ${move.keys.length} keyframes`
      : "no move authored";
    // Start the sliders where the move actually is, so dragging them is a
    // deviation from the authored camera and not from an imaginary zero.
    if (cam) {
      state.yaw = cam.yaw; state.pitch = cam.pitch;
      root.querySelector("#yaw").value = String(cam.yaw);
      root.querySelector("#pitch").value = String(cam.pitch);
      root.querySelector("#yval").textContent = cam.yaw;
      root.querySelector("#pval").textContent = cam.pitch;
    }
    renderInfo(name, info);
    renderChannels(name, parseFloat(root.querySelector("#scrub").value) || 0);
    applyCam();
    if (q.has("t") && q.get("name") === name) {
      const t = parseFloat(q.get("t"));
      state.playing = false;
      root.querySelector("#play").textContent = "Play";
      root.querySelector("#play").setAttribute("aria-pressed", "false");
      root.querySelector("#scrub").value = String(t);
      root.querySelector("#tval").textContent = t.toFixed(2);
      if (state.anim) { state.anim.pause(); state.anim.seek(t); }
      renderChannels(name, t);
    }
    window.__ready = true;
  }

  function renderInfo(name, info) {
    const el = root.querySelector("#info");
    if (!info) { el.innerHTML = `<h2>${name}</h2><div class="tag">not in the library</div>`; return; }
    const e = info.entry;
    const rows = [
      ["library", info.training.label],
      ["group", info.category.label],
      ["primary", (e.primary || []).join(", ") || "-"],
      ["secondary", (e.secondary || []).join(", ") || "-"],
      ["equipment", e.equipment || "none"],
      ["level", e.level || "-"],
    ];
    if (e.kind) rows.push(["kind", e.kind]);
    if (e.seconds) rows.push(["seconds", e.seconds + (e.perSide ? " per side" : "")]);
    if (e.prepares) rows.push(["prepares", e.prepares.join(", ")]);
    if (e.avoidIf) rows.push(["avoid if", e.avoidIf.join(", ")]);
    el.innerHTML = `<h2>${name}</h2><div class="tag">${info.training.label} &middot; ${info.category.label}</div>
      <dl class="kv">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>
      ${e.cue ? `<div class="cue">${e.cue}</div>` : ""}
      ${hasMove(name) ? "" : `<div class="nomove">No move authored yet. See knowledge/motion/AUTHORING.md.</div>`}`;
  }

  root.querySelector("#scrub").oninput = (ev) => {
    const t = parseFloat(ev.target.value);
    root.querySelector("#tval").textContent = t.toFixed(2);
    renderChannels(state.name, t);
    state.playing = false;
    root.querySelector("#play").textContent = "Play";
    root.querySelector("#play").setAttribute("aria-pressed", "false");
    if (state.anim) { state.anim.pause(); state.anim.seek(t); }
  };
  root.querySelector("#speed").oninput = (ev) => {
    state.speed = parseFloat(ev.target.value);
    root.querySelector("#sval").textContent = state.speed.toFixed(2).replace(/0$/, "") + "x";
    if (state.anim) state.anim.setSpeed(state.speed);
  };
  // Camera: yaw and pitch are degrees away from the move's own plane, so 0,0
  // is always what the move was authored against.
  function camera() {
    const base = cameraFor(moveFor(state.name) ? moveFor(state.name).view : "side");
    return { yaw: state.yaw, pitch: state.pitch, plane: base.plane };
  }
  function applyCam() {
    if (state.anim) state.anim.setView(camera());
  }
  root.querySelector("#yaw").oninput = (ev) => {
    state.yaw = parseFloat(ev.target.value);
    root.querySelector("#yval").textContent = state.yaw;
    applyCam();
  };
  root.querySelector("#pitch").oninput = (ev) => {
    state.pitch = parseFloat(ev.target.value);
    root.querySelector("#pval").textContent = state.pitch;
    applyCam();
  };

  // What is actually driving this frame. v2 added nineteen channels and the
  // only way to author with them is to watch them move.
  const BASE_CH = new Set(["spine", "neck"]);
  function renderChannels(name, t) {
    const el = root.querySelector("#chans");
    const mv = moveFor(name);
    if (!mv) { el.textContent = ""; return; }
    const pose = samplePose(mv, t, t * mv.dur);
    const rows = [];
    rows.push(`root ${pose.root.x.toFixed(0)},${pose.root.y.toFixed(0)} rot ${(pose.root.rot || 0).toFixed(0)}`);
    const live = Object.entries(pose.joints)
      .filter(([k, v]) => Math.abs(v) > 0.5 && !BASE_CH.has(k))
      .sort(([a], [b]) => a.localeCompare(b));
    const v2ch = live.filter(([k]) => /Twist|Roll|Girdle|Pron|Rot[LR]$|Abd|Fwd/.test(k));
    const base = live.filter(([k]) => !/Twist|Roll|Girdle|Pron|Rot[LR]$|Abd|Fwd/.test(k));
    if (v2ch.length) rows.push("<b>" + v2ch.map(([k, v]) => `${k} ${v.toFixed(0)}`).join("  ") + "</b>");
    if (base.length) rows.push(base.map(([k, v]) => `${k} ${v.toFixed(0)}`).join("  "));
    el.innerHTML = rows.join("<br>");
  }

  root.querySelector("#play").onclick = (ev) => {
    state.playing = !state.playing;
    ev.target.textContent = state.playing ? "Pause" : "Play";
    ev.target.setAttribute("aria-pressed", String(state.playing));
    if (state.anim) state.playing ? state.anim.play() : state.anim.pause();
  };
  root.querySelector("#accent").onclick = (ev) => {
    state.accent = state.accent === "action" ? "stretch" : "action";
    ev.target.setAttribute("aria-pressed", String(state.accent === "stretch"));
    document.documentElement.dataset.accent = state.accent;
    if (state.anim) state.anim.setAccent(state.accent);
    for (const rec of state.cells.values()) if (rec.anim) rec.anim.setAccent(state.accent);
  };
  root.querySelector("#skin").onclick = (ev) => {
    state.skin = state.skin === "anatomy" ? "mannequin" : "anatomy";
    ev.target.setAttribute("aria-pressed", String(state.skin === "anatomy"));
    if (state.anim) {
      state.anim.setSkin(state.skin);
      state.anim.setLit(state.skin === "anatomy" ? { muscles: LIT[state.name] || [], color: LIT_COLOR } : null);
    }
    for (const [n, rec] of state.cells) {
      if (!rec.anim) continue;
      rec.anim.setSkin(state.skin);
      rec.anim.setLit(state.skin === "anatomy" ? { muscles: LIT[n] || [], color: LIT_COLOR } : null);
    }
  };
  root.querySelector("#theme").onclick = (ev) => {
    state.theme = state.theme === "dark" ? "light" : "dark";
    ev.target.textContent = state.theme === "dark" ? "Light" : "Dark";
    document.documentElement.dataset.theme = state.theme;
    if (state.anim) state.anim.setTheme(state.theme);
    for (const rec of state.cells.values()) if (rec.anim) rec.anim.setTheme(state.theme);
  };

  renderTabs();
  renderGrid();
  select(state.name && hasMove(state.name) ? state.name : MOVE_NAMES[0]);
}
</script>
</body>
</html>
