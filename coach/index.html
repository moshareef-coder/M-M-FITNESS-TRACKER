<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fit Together · Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<style>
/* Palette: charcoal ink / warm off-white surfaces / sky blue (you) / vitality green (partner) / brass (xp) */
  :root {
    /* Sky blue for you, vitality green for your partner. Two people doing real
       work on the screen is exactly the job colour should be doing, so this
       is the one place hue is allowed to carry meaning. */
    --bg: #101418;
    --panel: #171c21;
    --panel-2: #1e242a;
    --border: #262d34;
    --text: #eaeef0;
    --muted: #8b9aa3;
    --accent: #7ec2ee;
    --gold: #d5a35f;
    --me: #7ec2ee;
    --partner: #4c9b72;
    --up: #e2566c;
    --down: #7ec2ee;
    --on-accent: #0b1013;
    --radius: 16px;
    --font-body: "IBM Plex Sans", -apple-system, sans-serif;
  }
::selection { background: var(--accent); color: var(--on-accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    transition: background 0.2s, color 0.2s;
  }
.hidden { display: none !important; }
.btn-primary {
    width: 100%; padding: 14px 16px; border-radius: 12px; border: none;
    background: var(--accent); color: var(--on-accent); font-size: 16px; font-weight: 600; cursor: pointer;
  }
.btn-primary:active { opacity: 0.85; }
.btn-primary:disabled, .btn-secondary:disabled {
    opacity: 0.4; cursor: not-allowed; background: var(--panel-2);
    color: var(--muted); border: 1px solid var(--border);
  }
.btn-secondary {
    width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border);
    background: transparent; color: var(--text); font-size: 15.5px; cursor: pointer; margin-top: 8px;
  }
.card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px 18px; margin-bottom: 12px;
  }
.card h2 {
    font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.09em;
    color: var(--muted); margin: 0 0 14px; font-weight: 700;
  }
.btn-danger {
    width: 100%; padding: 13px 18px; border-radius: 12px; border: none; cursor: pointer;
    background: var(--up); color: #fff; font-size: 16px; font-weight: 700;
  }
.btn-danger:disabled { opacity: 0.45; cursor: not-allowed; }
body.session-open .tabs { display: none; }
/* Card heads with a side link */
  .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.card-head h2 { margin: 0; }
.card-link {
    border: none; background: none; cursor: pointer; font-family: inherit;
    color: var(--accent); font-size: 14px; font-weight: 700; padding: 0;
  }
.pair { display: flex; align-items: center; gap: 9px; }
.pair-av {
    width: 27px; height: 27px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 12.5px; font-weight: 800;
  }
.pair-av.me { background: var(--me); color: var(--on-accent); }
.pair-av.them { background: var(--partner); color: #fff; }
label { font-size: 13.5px; color: var(--muted); display: block; margin-bottom: 4px; }
input[type="number"], input[type="date"], input[type="text"], textarea, select {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text); font-size: 16px; font-family: inherit;
  }
textarea { resize: vertical; min-height: 44px; }
.muted-note { color: var(--muted); font-size: 14.5px; }
select#exerciseSelect { margin-bottom: 10px; }
.btn-ghost {
    padding: 14px 16px; border-radius: 12px; border: 1px solid var(--border); background: transparent;
    color: var(--muted); font-size: 15.5px; cursor: pointer;
  }
.toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 100px; font-size: 15.5px; z-index: 50;
    opacity: 0; pointer-events: none; transition: opacity 0.25s;
  }
.toast.show { opacity: 1; }
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--muted); border-top-color: transparent; border-radius: 50%; animation: spin 0.7s linear infinite; }

  /* Coach dashboard is desktop-first on purpose: coaches work at a desk. */
  body { background: var(--bg); color: var(--text); font-family: var(--font-body); }
  .shell { max-width: 1180px; margin: 0 auto; padding: 28px 28px 80px; }

  .chead { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
  .chead h1 { font-size: 24px; letter-spacing: -.02em; margin: 0; }
  .chead .sub { font-size: 13.5px; color: var(--muted); margin-top: 3px; }
  .chead-right { display: flex; align-items: center; gap: 12px; }

  .signin { max-width: 420px; margin: 14vh auto; text-align: center; }
  .signin h1 { font-size: 30px; letter-spacing: -.025em; margin: 0 0 8px; }
  .signin p { color: var(--muted); line-height: 1.55; margin: 0 0 26px; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 22px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
  .stat-v { font-size: 28px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
  .stat-l { font-size: 12px; color: var(--muted); margin-top: 8px; }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; font-weight: 800; letter-spacing: .09em; color: var(--muted);
       text-transform: uppercase; padding: 0 14px 12px; }
  td { padding: 14px; border-top: 1px solid var(--border); font-size: 14.5px; vertical-align: middle; }
  tr.row { cursor: pointer; }
  tr.row:hover td { background: var(--panel-2); }
  .who { display: flex; align-items: center; gap: 11px; }
  .who-av { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: var(--on-accent);
            display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; flex-shrink: 0; }
  .who-name { font-weight: 700; }
  .who-mail { font-size: 12px; color: var(--muted); }
  .bar { height: 6px; border-radius: 100px; background: var(--panel-2); overflow: hidden; min-width: 110px; }
  .bar i { display: block; height: 100%; border-radius: 100px; background: var(--accent); }
  .pill { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 100px;
          background: var(--panel-2); color: var(--muted); }
  .pill.on { color: var(--down); }
  .pill.off { color: var(--up); }

  .drawer-scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; justify-content: flex-end; z-index: 40; }
  .drawer { width: min(460px, 92vw); background: var(--panel); border-left: 1px solid var(--border);
            height: 100%; overflow-y: auto; padding: 26px; }
  .drawer h2 { margin-top: 0; }
  .kv { display: flex; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .kv:last-child { border-bottom: none; }
  .kv b { font-weight: 700; }

  .row-actions { display: flex; gap: 8px; }
  .mini {
    padding: 6px 12px; border-radius: 100px; cursor: pointer; font-family: inherit;
    font-size: 12.5px; font-weight: 700; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--muted);
  }
  .mini:hover { color: var(--text); border-color: var(--accent); }
  .mini.danger:hover { color: var(--up); border-color: var(--up); }

  .invite { display: flex; gap: 10px; margin-top: 16px; }
  .invite input { flex: 1; }
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  @media (max-width: 760px) { .stats { grid-template-columns: repeat(2, 1fr); } .shell { padding: 20px 16px 60px; } }
</style>
</head>
<body>
<div class="shell" id="shell">
  <div class="signin" id="signin">
    <h1>Coach dashboard</h1>
    <p>Sign in to see how everyone you train is doing. This is the desk view; your clients use the app.</p>
    <button class="btn-primary" id="googleBtn">Sign in with Google</button>
  </div>

  <div id="app" class="hidden">
    <div class="chead">
      <div>
        <h1 id="groupName">Loading…</h1>
        <div class="sub" id="groupSub"></div>
      </div>
      <div class="chead-right">
        <button class="mini" id="communityBtn"></button>
        <button class="mini" id="signOutBtn">Sign out</button>
      </div>
    </div>

    <div class="stats" id="stats"></div>

    <div class="card">
      <table>
        <thead><tr><th>Client</th><th>This week</th><th>Streak</th><th>Last trained</th><th></th></tr></thead>
        <tbody id="roster"></tbody>
      </table>
      <div class="invite">
        <input type="email" id="inviteEmail" placeholder="their@email.com" />
        <button class="btn-secondary" id="inviteBtn" style="width:auto;">Add client</button>
      </div>
      <p class="muted-note" id="seatNote"></p>
    </div>
  </div>

  <div id="noGroup" class="hidden">
    <div class="empty">
      <h1>Start a group</h1>
      <p class="muted-note">You are not coaching a group yet. Create one and add your clients.</p>
      <div class="invite" style="max-width:420px;margin:20px auto 0;">
        <input type="text" id="newGroupName" placeholder="Group name, e.g. Ali's 6am squad" />
        <button class="btn-primary" id="createBtn" style="width:auto;">Create</button>
      </div>
    </div>
  </div>
</div>

<div class="drawer-scrim hidden" id="drawerScrim"><div class="drawer" id="drawer"></div></div>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://stcpiovpjismhltklfdw.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_890hsPHDiiz4-fQi7Jqd9g_a_aoHyz2";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = (id) => document.getElementById(id);
let ME = "", GROUP = null, MEMBERS = [], ENTRIES = [], LOGS = [], PROFILES = [];

function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2600); }
function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }
function todayStr() { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
function weekStart() { const d = new Date(todayStr() + "T00:00:00"); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.toISOString().slice(0, 10); }
function initials(n) { return (n || "?").trim().slice(0, 1).toUpperCase(); }

$("googleBtn").onclick = () => sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: location.href } });
$("signOutBtn").onclick = () => sb.auth.signOut().then(() => location.reload());

sb.auth.onAuthStateChange((e, s) => { if (e === "SIGNED_IN" && s) start(s); if (e === "SIGNED_OUT") location.reload(); });
sb.auth.getSession().then(({ data }) => { if (data.session) start(data.session); });

async function start(session) {
  ME = (session.user.email || "").toLowerCase();
  $("signin").classList.add("hidden");
  await load();
}

async function load() {
  // Only groups this coach owns. RLS already limits what comes back.
  const { data: groups } = await sb.from("groups").select("*").eq("kind", "coach");
  GROUP = (groups || []).find((g) => (g.owner_email || "").toLowerCase() === ME) || null;

  if (!GROUP) { $("app").classList.add("hidden"); $("noGroup").classList.remove("hidden"); return; }
  $("noGroup").classList.add("hidden");
  $("app").classList.remove("hidden");

  const [m, e, l, p] = await Promise.all([
    sb.from("group_members").select("*").eq("group_id", GROUP.id).is("left_at", null),
    sb.from("fit_entries").select("*").order("entry_date", { ascending: true }),
    sb.from("exercise_logs").select("*"),
    sb.from("profiles").select("*"),
  ]);
  MEMBERS = (m.data || []).filter((x) => x.email.toLowerCase() !== ME);
  ENTRIES = e.data || []; LOGS = l.data || []; PROFILES = p.data || [];
  render();
}

const profileOf = (email) => PROFILES.find((p) => p.email.toLowerCase() === email.toLowerCase()) || {};
const entriesOf = (email) => ENTRIES.filter((x) => x.email.toLowerCase() === email.toLowerCase());

function weekCount(email) {
  const ws = weekStart();
  return new Set(entriesOf(email).filter((x) => x.gym && x.entry_date >= ws).map((x) => x.entry_date)).size;
}
function streakOf(email) {
  const days = new Set(entriesOf(email).filter((x) => x.gym).map((x) => x.entry_date));
  const rest = new Set(entriesOf(email).filter((x) => x.rest_day).map((x) => x.entry_date));
  if (!days.size) return 0;
  let n = 0; const c = new Date(todayStr() + "T00:00:00");
  if (!days.has(todayStr()) && !rest.has(todayStr())) c.setDate(c.getDate() - 1);
  for (;;) {
    const k = c.toISOString().slice(0, 10);
    if (days.has(k)) { n++; c.setDate(c.getDate() - 1); }
    else if (rest.has(k)) { c.setDate(c.getDate() - 1); }
    else break;
  }
  return n;
}
function lastTrained(email) {
  const d = entriesOf(email).filter((x) => x.gym).map((x) => x.entry_date).sort();
  if (!d.length) return null;
  const days = Math.round((new Date(todayStr()) - new Date(d[d.length - 1])) / 86400000);
  return days === 0 ? "Today" : days === 1 ? "Yesterday" : `${days} days ago`;
}
function volumeOf(email, days = 7) {
  const from = new Date(todayStr() + "T00:00:00"); from.setDate(from.getDate() - (days - 1));
  const f = from.toISOString().slice(0, 10);
  return LOGS.filter((l) => l.email && l.email.toLowerCase() === email.toLowerCase() && l.entry_date >= f)
    .reduce((s, l) => s + (l.weight || 0) * (l.reps || 0) * (l.sets || 1), 0);
}

function render() {
  $("groupName").textContent = GROUP.name;
  const used = MEMBERS.length + 1;
  $("groupSub").textContent = `${used} of ${GROUP.seat_limit} seats used, including you`;
  $("seatNote").textContent = used >= GROUP.seat_limit
    ? "Your group is full. Remove someone or move up a tier to add more."
    : `${GROUP.seat_limit - used} seat${GROUP.seat_limit - used === 1 ? "" : "s"} left.`;

  $("communityBtn").textContent = GROUP.members_see_each_other ? "Community on" : "Community off";
  $("communityBtn").className = "mini";
  $("communityBtn").onclick = toggleCommunity;

  const active = MEMBERS.filter((m) => weekCount(m.email) > 0).length;
  const behind = MEMBERS.filter((m) => {
    const t = profileOf(m.email).challenge_target || 4;
    return weekCount(m.email) < t / 2;
  }).length;
  const totalSessions = MEMBERS.reduce((s, m) => s + weekCount(m.email), 0);

  $("stats").innerHTML = [
    [MEMBERS.length, "Clients"],
    [active, "Trained this week"],
    [behind, "Falling behind"],
    [totalSessions, "Sessions this week"],
  ].map(([v, l]) => `<div class="stat"><div class="stat-v">${v}</div><div class="stat-l">${l}</div></div>`).join("");

  $("roster").innerHTML = MEMBERS.length ? MEMBERS.map((m) => {
    const p = profileOf(m.email);
    const name = p.user_name || m.email.split("@")[0];
    const target = p.challenge_target || 4;
    const done = weekCount(m.email);
    const pct = Math.min(100, Math.round((done / target) * 100));
    return `<tr class="row" data-email="${esc(m.email)}">
      <td><div class="who"><span class="who-av">${esc(initials(name))}</span>
        <span><span class="who-name">${esc(name)}</span><br><span class="who-mail">${esc(m.email)}</span></span></div></td>
      <td><div style="display:flex;align-items:center;gap:10px;">
        <span style="font-weight:700;min-width:34px;">${done}/${target}</span>
        <span class="bar"><i style="width:${pct}%"></i></span></div></td>
      <td>${streakOf(m.email)} d</td>
      <td>${esc(lastTrained(m.email) || "Never")}</td>
      <td><div class="row-actions"><button class="mini danger" data-remove="${esc(m.email)}">Remove</button></div></td>
    </tr>`;
  }).join("") : `<tr><td colspan="5"><div class="empty">No clients yet. Add one below.</div></td></tr>`;

  document.querySelectorAll("tr.row").forEach((tr) => {
    tr.onclick = (ev) => { if (ev.target.dataset.remove) return; openClient(tr.dataset.email); };
  });
  document.querySelectorAll("[data-remove]").forEach((b) => {
    b.onclick = (ev) => { ev.stopPropagation(); removeClient(b.dataset.remove); };
  });
}

function openClient(email) {
  const p = profileOf(email);
  const name = p.user_name || email.split("@")[0];
  const recent = entriesOf(email).filter((e) => e.gym).slice(-8).reverse();
  $("drawer").innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;">
      <div><h2 style="margin:0;">${esc(name)}</h2><div class="muted-note">${esc(email)}</div></div>
      <button class="mini" id="closeDrawer">Close</button>
    </div>
    <div style="margin-top:22px;">
      <div class="kv"><span>Goal</span><b>${esc(p.goal || "Not set")}</b></div>
      <div class="kv"><span>Weekly target</span><b>${p.challenge_target || 4} days</b></div>
      <div class="kv"><span>This week</span><b>${weekCount(email)} trained</b></div>
      <div class="kv"><span>Streak</span><b>${streakOf(email)} days</b></div>
      <div class="kv"><span>Volume, 7 days</span><b>${Math.round(volumeOf(email)).toLocaleString()} lb</b></div>
      <div class="kv"><span>Last trained</span><b>${esc(lastTrained(email) || "Never")}</b></div>
    </div>
    <h2 style="margin-top:26px;">Recent sessions</h2>
    ${recent.length ? recent.map((r) => `<div class="kv"><span>${esc(r.entry_date)}</span><b>${r.sessions > 1 ? r.sessions + " sessions" : "1 session"}</b></div>`).join("")
      : `<p class="muted-note">Nothing logged yet.</p>`}`;
  $("closeDrawer").onclick = closeDrawer;
  $("drawerScrim").classList.remove("hidden");
  $("drawerScrim").onclick = (ev) => { if (ev.target === $("drawerScrim")) closeDrawer(); };
}
function closeDrawer() { $("drawerScrim").classList.add("hidden"); }

async function toggleCommunity() {
  const next = !GROUP.members_see_each_other;
  const { error } = await sb.from("groups").update({ members_see_each_other: next }).eq("id", GROUP.id);
  if (error) { toast("Could not change that"); return; }
  toast(next ? "Clients can now see each other" : "Clients can no longer see each other");
  await load();
}

$("createBtn").onclick = async () => {
  const name = $("newGroupName").value.trim() || "My group";
  const { data, error } = await sb.from("groups")
    .insert({ name, kind: "coach", owner_email: ME, seat_limit: 20 }).select().single();
  if (error) { toast("Could not create the group"); console.error(error); return; }
  await sb.from("group_members").insert({ group_id: data.id, email: ME, role: "coach" });
  await load();
};

$("inviteBtn").onclick = async () => {
  const email = $("inviteEmail").value.trim().toLowerCase();
  if (!email) { toast("Enter an email"); return; }
  if (MEMBERS.length + 1 >= GROUP.seat_limit) { toast("Your group is full"); return; }
  const { error } = await sb.from("group_members").insert({ group_id: GROUP.id, email, role: "client" });
  if (error) { toast(error.code === "23505" ? "Already in the group" : "Could not add them"); return; }
  $("inviteEmail").value = "";
  toast("Added. They will see you once they sign in.");
  await load();
};

async function removeClient(email) {
  if (!confirm(`Remove ${email} from the group? Their own data is kept.`)) return;
  const { error } = await sb.rpc("remove_group_member", { p_group_id: GROUP.id, p_email: email });
  if (error) { toast("Could not remove them"); console.error(error); return; }
  toast("Removed");
  await load();
}
</script>
</body>
</html>
