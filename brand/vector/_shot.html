<!doctype html>
<meta charset="utf-8">
<title>logo shot</title>
<!-- A real page served over http, because a data: URL page is an opaque origin
     and Chrome will not let it pull the SVG off the local server: the shot comes
     back empty with a broken-image glyph in the corner. -->
<style>html,body{margin:0;background:transparent;overflow:hidden}img{display:block}</style>
<img id="m" alt="">
<script>
  const q = new URLSearchParams(location.search);
  const el = document.getElementById("m");
  const s = Number(q.get("s") || 1024);
  el.width = s; el.height = s;
  el.onload = () => { window.__ready = true; };
  el.src = (q.get("f") || "unio-mark-flat") + ".svg";
</script>
